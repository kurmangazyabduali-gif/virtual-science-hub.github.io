<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ойын үлгілерінің кітапханасы — Virtual Science Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Glassmorphism / Neon */
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.15); }
        .neon-btn { background: #38bdf8; color: #020617; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); border: none; font-weight: 800; }
        .neon-btn:hover { background: #0ea5e9; box-shadow: 0 0 25px rgba(56, 189, 248, 0.6); transform: translateY(-2px); }
        .neon-text { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        
        .template-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #1e293b; background: rgba(15,23,42,0.6); }
        .template-card:hover { border-color: #38bdf8; transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.2); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        .slot-empty { background-color: rgba(15, 23, 42, 0.5); border-bottom-width: 4px; border-style: solid; }
        input[type="radio"]:checked { background-color: #38bdf8 !important; }
        
        /* Layout Fixes */
        .min-h-canvas { min-height: clamp(500px, 70vh, 800px); }
        
        /* AI Assistant Widget */
        .ai-fab { position: fixed; bottom: 2rem; right: 2rem; width: 60px; height: 60px; background: linear-gradient(135deg, #a855f7, #3b82f6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; box-shadow: 0 10px 25px rgba(168,85,247,0.5); cursor: pointer; z-index: 9999; border: 2px solid rgba(255,255,255,0.2); transition: all 0.3s; }
        .ai-fab:hover { transform: scale(1.1) rotate(5deg); box-shadow: 0 15px 35px rgba(59,130,246,0.6); }
        .ai-modal { position: fixed; bottom: 90px; right: 2rem; width: 350px; height: 500px; background: rgba(15,23,42,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(168,85,247,0.3); border-radius: 20px; z-index: 9998; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: translateY(20px); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .ai-modal.active { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .ai-header { background: linear-gradient(to right, rgba(168,85,247,0.2), rgba(59,130,246,0.1)); padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .ai-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; animation: slideIn 0.3s ease-out; }
        .msg.bot { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); align-self: flex-start; border-bottom-left-radius: 4px; color: #e2e8f0; }
        .msg.user { background: linear-gradient(135deg, #a855f7, #3b82f6); align-self: flex-end; border-bottom-right-radius: 4px; color: white; }
        .ai-input-area { padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; }
        .ai-input { flex: 1; background: #020617; border: 1px solid #1e293b; border-radius: 10px; padding: 10px 15px; color: white; outline: none; transition: border 0.3s; font-size: 14px; }
        .ai-input:focus { border-color: #a855f7; }
        .ai-send { background: linear-gradient(135deg, #a855f7, #3b82f6); border: none; width: 40px; height: 40px; border-radius: 10px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .ai-send:active { transform: scale(0.9); }
    </style>

    <script id="early-lang-sync">
        (function() {
            let cl = localStorage.getItem('vsh-lang') || 'kk';
            var gt = '/ru/' + cl;
            if (cl === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
                document.cookie = "googtrans=" + gt + "; path=/";
                if (location.hostname) {
                    document.cookie = "googtrans=" + gt + "; domain=" + location.hostname + "; path=/";
                    document.cookie = "googtrans=" + gt + "; domain=." + location.hostname + "; path=/";
                }
            }
        })();
    </script>
</head>
<body class="min-h-screen flex flex-col relative">

    <div class="fixed inset-0 pointer-events-none z-[-1]" style="background: radial-gradient(circle at 50% 10%, #0f172a, #020617);"></div>

    <!-- Top Nav -->
    <nav class="glass-panel sticky top-0 z-50 border-b-0 border-b border-[#1e293b]">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center cursor-pointer" onclick="navigate('templates')">
                    <div class="bg-[#38bdf8] w-9 h-9 rounded-xl flex items-center justify-center mr-3 shadow-[0_0_15px_rgba(56,189,248,0.5)]">
                        <i class="fa-solid fa-layer-group text-[#020617] text-lg"></i>
                    </div>
                    <span class="font-black text-2xl text-white tracking-wide">ActivityMaker<span class="text-[#38bdf8]">.</span></span>
                </div>
                
                <div class="hidden md:flex items-center space-x-6">
                    <button class="text-[#38bdf8] font-bold border-b-2 border-[#38bdf8] pb-1" onclick="navigate('templates')">Маркетплейс</button>
                    <button class="text-slate-400 hover:text-white font-medium pb-1 border-b-2 border-transparent transition">Менің жұмыстарым</button>
                    <button class="text-slate-400 hover:text-white font-medium pb-1 border-b-2 border-transparent transition">Статистика</button>
                </div>
                
                <div>
                    <a href="index.html" class="bg-[#1e293b] text-white px-4 py-2 rounded-lg font-bold hover:bg-[#334155] transition border border-[#334155]">
                        <span class="hidden sm:inline">Бас мәзірге</span> <i class="fa-solid fa-right-from-bracket sm:ml-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- AI Assistant Widget -->
    <button class="ai-fab" onclick="toggleAI()"><i class="fa-solid fa-robot"></i></button>
    <div class="ai-modal" id="ai-modal">
        <div class="ai-header">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-500 to-blue-500 flex items-center justify-center shadow-[0_0_10px_rgba(168,85,247,0.5)]"><i class="fa-solid fa-wand-magic-sparkles text-white text-xs"></i></div>
                <div><h3 class="font-bold text-white text-sm">Нейро-Көмекші</h3><p class="text-[10px] text-green-400">Желіде</p></div>
            </div>
            <button onclick="toggleAI()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="ai-messages" id="ai-msgs">
            <div class="msg bot">Сәлем! Мен кіріктірілген ИИ-мын <b>ActivityMaker</b>. Мен сізге кез келген тақырып бойынша ойын құрастыра аламын (редактордағы "АИ Генерация" түймесін басыңыз) немесе оқушының қатесін түсіндіре аламын. Қандай көмек керек?</div>
        </div>
        <div class="ai-input-area">
            <input type="text" id="ai-input" class="ai-input" placeholder="Кез келген нәрсені сұраңыз..." onkeypress="if(event.key==='Enter') sendAIMsg()">
            <button class="ai-send" onclick="sendAIMsg()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Main Router View -->
    <main class="flex-1 max-w-screen-2xl mx-auto px-4 sm:px-6 py-8 w-full relative" id="app-root"></main>

    <script>
        // --- 1. STATE & DATA ---
        const TEMPLATES = [
            // Classic
            { id: 'quiz', cat: 'classic', diff: 'EASY', name: 'Викторина', desc: 'Дұрыс жауапты таңдау тесті.', icon: 'fa-list-check', color: 'text-blue-400', bg: 'bg-blue-900/40', pro: false },
            { id: 'truefalse', cat: 'classic', diff: 'EASY', name: 'Шындық / Жалған', desc: 'Тұжырымдардың рас немесе жалған екенін белгілеңіз.', icon: 'fa-check-double', color: 'text-green-400', bg: 'bg-green-900/40', pro: false },
            { id: 'match', cat: 'classic', diff: 'MED', name: 'Жұбын тап', desc: 'Терминдерді өз анықтамаларымен сәйкестендіріңіз.', icon: 'fa-object-group', color: 'text-emerald-400', bg: 'bg-emerald-900/40', pro: false },
            // Language
            { id: 'anagram', cat: 'language', diff: 'HARD', name: 'Анаграмма', desc: 'Әріптердің орнын ауыстырып, сөздерді табыңыз.', icon: 'fa-spell-check', color: 'text-purple-400', bg: 'bg-purple-900/40', pro: false },
            { id: 'sentence', cat: 'language', diff: 'MED', name: 'Сөз тіркестері', desc: 'Сөйлемдегі сөздердің ретін қалпына келтіріңіз.', icon: 'fa-align-left', color: 'text-indigo-400', bg: 'bg-indigo-900/40', pro: false },
            { id: 'crossword', cat: 'language', diff: 'HARD', name: 'Сөзжұмбақ', desc: 'Сөздер тізімінен сөзжұмбақ жасау (Demo).', icon: 'fa-border-all', color: 'text-fuchsia-400', bg: 'bg-fuchsia-900/40', pro: true },
            // Games
            { id: 'memory', cat: 'games', diff: 'MED', name: 'Мемори (Карточкалар)', desc: 'Карталарды ашып, бірдей жұптарды табыңыз.', icon: 'fa-clone', color: 'text-pink-400', bg: 'bg-pink-900/40', pro: false },
            { id: 'wheel', cat: 'games', diff: 'EASY', name: 'Сәттілік дөңгелегі', desc: 'Тағдырдың интерактивті рулеткасы.', icon: 'fa-dharmachakra', color: 'text-rose-400', bg: 'bg-rose-900/40', pro: false },
            { id: 'box', cat: 'games', diff: 'EASY', name: 'Қорапты аш', desc: 'Кездейсоқ қорапты таңдаңыз.', icon: 'fa-box-open', color: 'text-cyan-400', bg: 'bg-cyan-900/40', pro: false },
            { id: 'falling', cat: 'games', diff: 'HARD', name: 'Құлап жатқан жауаптар', desc: 'Дұрыс жауаптарды ұстаңыз.', icon: 'fa-arrow-down', color: 'text-sky-400', bg: 'bg-sky-900/40', pro: true },
            // Logic
            { id: 'odd', cat: 'logic', diff: 'MED', name: 'Артық сөз', desc: 'Топқа сәйкес келмейтін сөзді табыңыз.', icon: 'fa-not-equal', color: 'text-orange-400', bg: 'bg-orange-900/40', pro: false },
            { id: 'timeline', cat: 'logic', diff: 'HARD', name: 'Уақыт желісі', desc: 'Оқиғаларды хронология бойынша орналастырыңыз.', icon: 'fa-clock-rotate-left', color: 'text-yellow-400', bg: 'bg-yellow-900/40', pro: true },
            // Math
            { id: 'equation', cat: 'math', diff: 'HARD', name: 'Формулалар тренажері', desc: 'Мысалдарды құлап түскенше уақытқа шешіңіз.', icon: 'fa-calculator', color: 'text-red-400', bg: 'bg-red-900/40', pro: true },
        ];

        let state = {
            view: 'templates',
            activeTemplate: null,
            filters: { search: '', cat: 'all', diff: 'all' },
            editorData: { title: '', items: [], settings: { timer: 0, shuffle: true } },
            gameData: { step: 0, score: 0 }
        };

        // --- 2. CORE RENDERING ---
        function render() {
            const root = document.getElementById('app-root');
            root.innerHTML = state.view === 'templates' ? renderMarketplace() 
                           : state.view === 'editor' ? renderEditor() 
                           : renderGameUI();
            
            if (state.view === 'game') initGameEngine();
        }

        function navigate(view, data) {
            state.view = view;
            if (view === 'editor') {
                state.activeTemplate = data;
                const t = TEMPLATES.find(x => x.id === data);
                state.editorData = { title: `Игра: ${t.name}`, items: [], settings: { timer: 60, shuffle: true } };
                if (data === 'quiz') state.editorData.items = [{ q: 'Францияның астанасы?', ans: ['Париж', 'Рим', 'Лондон', 'Берлин'], correct: 0 }];
                else if (data === 'anagram') state.editorData.items = [{ word: 'REACT', clue: 'Танымал JS кітапханасы' }];
                else if (data === 'truefalse') state.editorData.items = [{ statement: 'Жер тегіс', isTrue: false }, { statement: 'Су 100°C-та қайнайды', isTrue: true }];
                else if (data === 'match') state.editorData.items = [{ term: 'H2O', def: 'Су' }, { term: 'CO2', def: 'Көмірқышқыл газы' }];
                else if (data === 'odd') state.editorData.items = [{ cat: 'Көкөністер', items: ['Сәбіз', 'Картоп', 'Орамжапырақ', 'Алма'], oddIdx: 3 }];
                else if (data === 'sentence') state.editorData.items = [{ phrase: 'Javascript ең жақсы бағдарламалау тілі' }];
                else if (data === 'memory') state.editorData.items = [{ pair: '🐶', pair2: 'Ит' }, { pair: '🐱', pair2: 'Мысық' }];
                else if (data === 'wheel' || data === 'box') state.editorData.items = [{ text: 'Жүлде 1' }, { text: 'Айыппұл 2' }, { text: 'Супер Сұрақ' }, { text: 'Бонус' }];
            }
            render();
        }

        // --- 3. TEMPLATES MARKETPLACE ---
        function updateFilter(key, val) { state.filters[key] = val; render(); }

        function renderMarketplace() {
            const { search, cat, diff } = state.filters;
            
            let filtered = TEMPLATES.filter(t => {
                if(search && !t.name.toLowerCase().includes(search.toLowerCase())) return false;
                if(cat !== 'all' && t.cat !== cat) return false;
                if(diff !== 'all' && t.diff !== diff) return false;
                return true;
            });

            const cards = filtered.map(t => {
                const diffColor = t.diff === 'EASY' ? 'text-green-400 border-green-500/30 bg-green-900/20' : t.diff === 'MED' ? 'text-yellow-400 border-yellow-500/30 bg-yellow-900/20' : 'text-red-400 border-red-500/30 bg-red-900/20';
                
                return `
                <div class="template-card p-6 rounded-3xl cursor-pointer relative flex flex-col h-full group pb-20" onclick="if(!${t.pro}) navigate('editor', '${t.id}')">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-14 h-14 ${t.bg} border border-[#1e293b] rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                            <i class="fa-solid ${t.icon} text-2xl ${t.color}"></i>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            ${t.pro ? '<span class="pro-badge text-white text-[10px] tracking-widest font-black px-2 py-1 rounded-md shadow uppercase">PRO</span>' : ''}
                            <span class="${diffColor} text-[10px] tracking-widest font-bold px-2 py-1 rounded-md border uppercase">${t.diff}</span>
                        </div>
                    </div>
                    
                    <h3 class="text-xl font-black text-white mb-2 leading-tight">${t.name}</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">${t.desc}</p>
                    
                    <div class="absolute bottom-6 left-6 right-6">
                        ${t.pro ? '<button class="w-full py-3 bg-[#1e293b] text-slate-500 rounded-xl font-bold border border-[#334155] cursor-not-allowed">Жазылым арқылы қолжетімді</button>' 
                                : '<button class="w-full py-3 bg-[#38bdf8]/10 text-[#38bdf8] group-hover:bg-[#38bdf8] group-hover:text-[#020617] transition-all rounded-xl font-bold border border-[#0ea5e9]/30">Үлгіні таңдау</button>'}
                    </div>
                </div>
            `;
            }).join('');

            return `
                <div class="fade-in max-w-7xl mx-auto">
                    <!-- Hero -->
                    <div class="mb-10 text-center">
                        <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r from-[#38bdf8] to-[#818cf8]">Үлгілер маркетплейсі</h1>
                        <p class="text-slate-400 mt-2 text-lg max-w-2xl mx-auto">Ойын түріндегі сабақтар мен интерактивтерді 2 рет басу арқылы жасаңыз. Үлгіні таңдаңыз, мазмұнды толтырыңыз — жүйе ойынды өзі құрастырады.</p>
                    </div>
                    
                    <!-- Search & Filters -->
                    <div class="glass-panel p-4 rounded-2xl mb-10 flex flex-col lg:flex-row gap-4">
                        <div class="flex-1 relative">
                            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" placeholder="Ойындарды іздеу..." value="${search}" oninput="updateFilter('search', this.value)" 
                                   class="w-full pl-12 pr-4 py-4 bg-[#020617] border border-[#1e293b] rounded-xl text-white outline-none focus:border-[#38bdf8] transition font-medium">
                        </div>
                        <div class="flex gap-4">
                            <select onchange="updateFilter('cat', this.value)" class="bg-[#020617] border border-[#1e293b] rounded-xl px-4 py-4 text-white font-medium outline-none cursor-pointer focus:border-[#38bdf8]">
                                <option value="all" ${cat==='all'?'selected':''}>Барлық санаттар</option>
                                <option value="classic" ${cat==='classic'?'selected':''}>Классика</option>
                                <option value="language" ${cat==='language'?'selected':''}>Тілдер</option>
                                <option value="games" ${cat==='games'?'selected':''}>Геймификация</option>
                                <option value="logic" ${cat==='logic'?'selected':''}>Логика</option>
                                <option value="math" ${cat==='math'?'selected':''}>Математика</option>
                            </select>
                            <select onchange="updateFilter('diff', this.value)" class="bg-[#020617] border border-[#1e293b] rounded-xl px-4 py-4 text-white font-medium outline-none cursor-pointer focus:border-[#38bdf8]">
                                <option value="all" ${diff==='all'?'selected':''}>Кез келген қиындық</option>
                                <option value="EASY" ${diff==='EASY'?'selected':''}>Оңай (Easy)</option>
                                <option value="MED" ${diff==='MED'?'selected':''}>Орташа (Medium)</option>
                                <option value="HARD" ${diff==='HARD'?'selected':''}>Қиын (Hard)</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Grid -->
                    ${filtered.length > 0 ? 
                        `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">${cards}</div>` : 
                        `<div class="text-center py-20 text-slate-500 font-bold text-xl"><i class="fa-solid fa-ghost mb-4 text-4xl block opacity-50"></i> Бұл сұрау бойынша ештеңе табылмады</div>`
                    }
                </div>
            `;
        }

        // --- 4. EDITOR PAGE ---
        function renderEditor() {
            const t = TEMPLATES.find(temp => temp.id === state.activeTemplate);
            return `
                <div class="fade-in flex flex-col h-[calc(100vh-140px)]">
                    
                    <div class="flex items-center mb-6 py-2 px-1 border-b border-[#1e293b]">
                        <button onclick="navigate('templates')" class="w-10 h-10 bg-[#0f172a] rounded-xl border border-[#1e293b] text-slate-400 hover:text-white hover:border-[#38bdf8] mr-4 flex justify-center items-center">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <div>
                            <p class="text-[10px] uppercase font-bold text-[#38bdf8] mb-0.5 tracking-wider"><i class="fa-solid ${t.icon} mr-1"></i> ${t.name} Редакторы</p>
                            <h1 class="text-2xl font-black text-white">${state.editorData.title}</h1>
                        </div>
                        <div class="ml-auto flex gap-3">
                             <button onclick="aiOpenGenerator(event)" class="bg-gradient-to-r from-purple-500 to-blue-500 border-none text-white px-6 py-3 rounded-xl transition flex items-center cursor-pointer text-sm font-bold shadow-[0_0_20px_rgba(168,85,247,0.4)] hover:scale-105">
                                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> АИ Генерация
                             </button>
                             <button onclick="navigate('game')" class="neon-btn px-6 py-3 rounded-xl transition flex items-center cursor-pointer text-sm font-bold shadow-lg hover:shadow-xl hover:-translate-y-1">
                                <i class="fa-solid fa-bolt mr-2"></i> Ойынды жасау
                             </button>
                        </div>
                    </div>
                    
                    <div class="flex-1 flex gap-6 overflow-hidden">
                        
                        <!-- Left Panel: Content -->
                        <div class="w-full lg:w-2/3 flex flex-col shadow-2xl rounded-3xl overflow-hidden glass-panel">
                            <!-- Settings Bar -->
                            <div class="bg-[#0b1120] p-4 flex gap-4 border-b border-[#1e293b]">
                                <input type="text" value="${state.editorData.title}" oninput="state.editorData.title = this.value" placeholder="Ойынның атауы..." class="flex-1 bg-[#020617] border border-[#1e293b] rounded-lg p-3 text-white font-bold outline-none focus:border-[#38bdf8]">
                                <div class="flex bg-[#020617] border justify-center items-center border-[#1e293b] rounded-lg px-4 gap-2 text-sm font-medium text-slate-300">
                                    <i class="fa-solid fa-stopwatch text-slate-500"></i>
                                    Уақыт (сек): 
                                    <input type="number" value="${state.editorData.settings.timer}" onchange="state.editorData.settings.timer=this.value" class="w-12 bg-transparent outline-none text-white text-center font-bold">
                                </div>
                            </div>
                            
                            <!-- Items List -->
                            <div class="p-4 flex justify-between items-center bg-[#0f172a]">
                                <h3 class="font-bold text-slate-300">Элементтер (${state.editorData.items.length})</h3>
                                <button onclick="editorAddItem()" class="bg-[#1e293b] hover:bg-[#334155] border border-[#334155] text-white px-4 py-2 rounded-lg text-sm font-bold transition flex items-center">
                                    <i class="fa-solid fa-plus text-[#38bdf8] mr-2"></i> Қосу

                        </div>
                        
                        <!-- Right Panel: Info/Tips -->
                        <div class="w-1/3 hidden lg:flex flex-col gap-6">
                            <div class="glass-panel p-6 rounded-3xl flex-1 flex flex-col">
                                <h3 class="font-black text-xl mb-4 text-[#38bdf8]">Smart Engine <i class="fa-solid fa-microchip ml-2"></i></h3>
                                <p class="text-slate-400 text-sm mb-6 leading-relaxed">Жүйе үлгі бойынша ақылды генерацияны пайдаланады: <b>"${t.name}"</b>. Деректерді толтырыңыз, ал біз автоматты түрде:</p>
                                <ul class="text-sm text-slate-300 space-y-3 font-medium">
                                    <li><i class="fa-solid fa-check text-green-400 mr-2"></i> Сұрақтардың ретін кездейсоқ жасаймыз</li>

                                    <li><i class="fa-solid fa-check text-green-400 mr-2"></i> Ұпайлар мен комбо жүйесін қосамыз</li>
                                </ul>
                                
                                <div class="mt-auto p-6 bg-[#020617] rounded-2xl border border-[#1e293b] text-center">
                                    <i class="fa-solid fa-gamepad text-4xl text-slate-700 mb-4"></i>
                                    <p class="text-slate-500 font-bold text-sm">Ойыныңыз миллисекундтарда дайын болады.</p>

                        </div>
                        
                    </div>
                </div>
            `;
        }

        // --- EDITOR FORM RENDERER (Supports Multiple Templates) ---
        function renderEditorItems() {
            return state.editorData.items.map((item, idx) => {
                
                let innerContent = '';
                
                if (state.activeTemplate === 'quiz') {
                    innerContent = `
                        <input type="text" value="${item.q.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].q = this.value" placeholder="Сұрақты еңгізіңіз..." class="w-full p-4 mb-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none font-bold text-white">
                        <div class="grid grid-cols-2 gap-3">
                            ${item.ans.map((a, i) => `
                                <label class="flex items-center gap-3 p-3 rounded-xl border-2 transition cursor-pointer ${item.correct === i ? 'border-[#38bdf8] bg-[#38bdf8]/10' : 'border-[#1e293b] bg-[#020617] hover:border-[#334155]'}">
                                    <input type="radio" name="correct_${idx}" ${item.correct === i ? 'checked' : ''} onchange="state.editorData.items[${idx}].correct = ${i}; document.getElementById('editor-items-list').innerHTML = renderEditorItems()" class="w-4 h-4 text-[#38bdf8] bg-transparent focus:ring-0">
                                    <input type="text" value="${a.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].ans[${i}] = this.value" placeholder="Нұсқа ${i+1}" class="flex-1 bg-transparent border-none outline-none font-medium text-sm text-slate-300">
                                </label>
                            `).join('')}
                        </div>
                    `;
                } else if (state.activeTemplate === 'anagram') {
                    innerContent = `
                        <div class="flex flex-col md:flex-row gap-4">
                            <div class="flex-1">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Жасырын сөз</label>
                                <input type="text" value="${item.word}" onchange="state.editorData.items[${idx}].word = this.value.toUpperCase().replace(/[^А-ЯЁA-Z]/gi, '')" class="w-full p-4 text-center font-black tracking-[0.3em] uppercase bg-[#020617] border border-[#1e293b] rounded-xl text-purple-400 focus:border-purple-500 outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Ойыншыға арналған анықтама</label>
                                <textarea onchange="state.editorData.items[${idx}].clue = this.value" class="w-full p-4 h-[58px] bg-[#020617] border border-[#1e293b] rounded-xl text-slate-300 outline-none resize-none focus:border-[#38bdf8]">${item.clue}</textarea>
                            </div>
                        </div>
                    `;
                } else if (state.activeTemplate === 'truefalse') {
                    innerContent = `
                        <input type="text" value="${item.statement.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].statement = this.value" placeholder="Тұжырым..." class="w-full p-4 mb-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none font-bold text-white">
                        <div class="flex gap-4 items-center">
                            <span class="text-xs font-bold text-slate-500 uppercase">Бұл тұжырым:</span>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="tf_${idx}" ${item.isTrue ? 'checked' : ''} onchange="state.editorData.items[${idx}].isTrue = true; document.getElementById('editor-items-list').innerHTML = renderEditorItems()" class="w-4 h-4 text-green-500 bg-[#020617]">
                                <span class="font-bold ${item.isTrue ? 'text-green-400' : 'text-slate-500'}">Шындық</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer ml-4">
                                <input type="radio" name="tf_${idx}" ${!item.isTrue ? 'checked' : ''} onchange="state.editorData.items[${idx}].isTrue = false; document.getElementById('editor-items-list').innerHTML = renderEditorItems()" class="w-4 h-4 text-red-500 bg-[#020617]">
                                <span class="font-bold ${!item.isTrue ? 'text-red-400' : 'text-slate-500'}">Жалған</span>
                            </label>
                        </div>
                    `;
                } else if (state.activeTemplate === 'match') {
                    innerContent = `
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Термин / Ұғым</label>
                                <input type="text" value="${item.term.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].term = this.value" placeholder="Мысалы: HTML" class="w-full p-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none text-white font-bold">
                            </div>
                            <div class="flex-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Анықтама / Жұп</label>
                                <input type="text" value="${item.def.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].def = this.value" placeholder="Анықтама мәтіні..." class="w-full p-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none text-slate-300 font-medium">
                            </div>
                        </div>
                    `;
                } else if (state.activeTemplate === 'odd') {
                    innerContent = `
                        <input type="text" value="${item.cat.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].cat = this.value" placeholder="Санат немесе ереже (Міндетті емес)" class="w-full p-4 mb-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none font-bold text-white">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Сөздер (АРТЫҚ сөзді белгілеңіз)</label>
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                            ${item.items.map((a, i) => `
                                <div class="relative">
                                    <input type="radio" name="odd_${idx}" ${item.oddIdx === i ? 'checked' : ''} onchange="state.editorData.items[${idx}].oddIdx = ${i}; document.getElementById('editor-items-list').innerHTML = renderEditorItems()" class="absolute left-3 top-1/2 -translate-y-1/2 text-orange-500 bg-transparent focus:ring-0">
                                    <input type="text" value="${a.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].items[${i}] = this.value" placeholder="Сөз ${i+1}" class="w-full pl-8 pr-3 py-3 bg-[#020617] border ${item.oddIdx === i ? 'border-orange-500 text-orange-400' : 'border-[#1e293b] text-slate-300'} rounded-xl outline-none font-medium text-sm transition">
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (state.activeTemplate === 'sentence') {
                    innerContent = `
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Сөйлем (сөз блоктарына бөлінеді)</label>
                        <input type="text" value="${item.phrase.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].phrase = this.value" placeholder="Мысалы: Мен мектепке бардым" class="w-full p-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none text-white font-bold">
                    `;
                } else if (state.activeTemplate === 'memory') {
                    innerContent = `
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">1-карта (Мысалы смайлик)</label>
                                <input type="text" value="${item.pair.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].pair = this.value" class="w-full p-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none text-white font-bold">
                            </div>
                            <div class="flex-1">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">2-карта (Байланысты сөз)</label>
                                <input type="text" value="${item.pair2.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].pair2 = this.value" class="w-full p-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none text-slate-300 font-bold">
                            </div>
                        </div>
                    `;
                } else if (state.activeTemplate === 'wheel' || state.activeTemplate === 'box') {
                    innerContent = `
                        <input type="text" value="${item.text.replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].text = this.value" placeholder="Нұсқа. Мәтін." class="w-full p-4 bg-[#020617] border border-[#1e293b] rounded-xl outline-none text-white font-bold">
                    `;
                }

                return `
                    <div class="bg-[#0f172a] p-6 rounded-2xl border border-[#1e293b] relative group hover:border-[#38bdf8]/50 transition">
                        <div class="absolute -left-3 -top-3 w-8 h-8 rounded-full bg-[#1e293b] border-2 border-[#020617] text-slate-300 flex items-center justify-center font-black text-sm z-10">${idx+1}</div>
                        <button onclick="editorRemoveItem(${idx})" class="absolute top-4 right-4 text-slate-500 hover:text-red-500 transition"><i class="fa-solid fa-trash-can"></i></button>
                        ${innerContent}
                    </div>
                `;
            }).join('');
        }

        function editorAddItem() {
            if(state.activeTemplate === 'quiz') state.editorData.items.push({ q: 'Жаңа сұрақ', ans: ['В 1', 'В 2', 'В 3', 'В 4'], correct: 0 });
            else if (state.activeTemplate === 'anagram') state.editorData.items.push({ word: 'СӨЗ', clue: '' });
            else if (state.activeTemplate === 'truefalse') state.editorData.items.push({ statement: 'Жаңа тұжырым', isTrue: true });
            else if (state.activeTemplate === 'match') state.editorData.items.push({ term: 'Жаңа термин', def: 'Анықтама' });
            else if (state.activeTemplate === 'odd') state.editorData.items.push({ cat: '', items: ['1', '2', '3', 'Артық'], oddIdx: 3 });
            else if (state.activeTemplate === 'sentence') state.editorData.items.push({ phrase: 'Жаңа сөйлем' });
            else if (state.activeTemplate === 'memory') state.editorData.items.push({ pair: '1-карта', pair2: '2-карта' });
            else if (state.activeTemplate === 'wheel' || state.activeTemplate === 'box') state.editorData.items.push({ text: 'Супер жүлде' });
            document.getElementById('editor-items-list').innerHTML = renderEditorItems();
        }

        function editorRemoveItem(idx) {
            if(state.editorData.items.length <= 1) return alert('Кем дегенде 1 элемент қажет');
            state.editorData.items.splice(idx, 1);
            document.getElementById('editor-items-list').innerHTML = renderEditorItems();
        }

        // --- 5. GAME RENDERER WRAPPER ---
        function renderGameUI() {
            return `
                <div class="fade-in max-w-5xl mx-auto min-h-canvas flex flex-col rounded-[2rem] overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-[#1e293b] glass-panel relative">
                    <div class="bg-[#0b1120]/80 text-white px-6 py-4 flex justify-between items-center z-10 border-b border-[#1e293b] shadow-md backdrop-blur">
                        <button onclick="navigate('editor', state.activeTemplate)" class="text-slate-400 hover:text-white font-medium bg-[#1e293b] px-4 py-2 rounded-lg transition border border-[#334155] hover:bg-[#334155] text-sm flex items-center gap-2">
                            <i class="fa-solid fa-arrow-left"></i> Редакторға
                        </button>
                        <h2 class="font-black text-lg tracking-widest text-[#38bdf8] uppercase drop-shadow-md">${state.editorData.title}</h2>
                        <div class="text-sm font-mono text-slate-400 border border-[#334155] rounded-lg px-3 py-1 bg-[#020617]">ID: ${Math.floor(Math.random()*9000)+1000}</div>
                    </div>
                    <div id="game-canvas" class="flex-1 relative flex items-center justify-center overflow-hidden p-6 md:p-10"></div>
                </div>
            `;
        }

        // --- 6. GAME ENGINES DISPATCHER ---
        function initGameEngine() {
            state.gameData.step = 0;
            state.gameData.score = 0;
            const canvas = document.getElementById('game-canvas');
            
            // Randomize items if settings.shuffle is true (shallow copy)
            if (state.editorData.settings.shuffle) {
                state.gameData.runItems = [...state.editorData.items].sort(() => Math.random() - 0.5);
            } else {
                state.gameData.runItems = [...state.editorData.items];
            }

            if (state.activeTemplate === 'quiz') runEngineQuiz(canvas);
            else if (state.activeTemplate === 'anagram') runEngineAnagram(canvas);
            else if (state.activeTemplate === 'truefalse') runEngineTrueFalse(canvas);
            else if (state.activeTemplate === 'match') { setTimeout(() => initEngineMatch(), 50); }
            else if (state.activeTemplate === 'odd') runEngineOdd(canvas);
            else if (state.activeTemplate === 'sentence') runEngineSentence(canvas);
            else if (state.activeTemplate === 'box') runEngineBox(canvas);
            else if (state.activeTemplate === 'wheel') runEngineWheel(canvas);
            else if (state.activeTemplate === 'memory') { setTimeout(() => initEngineMemory(), 50); }
            else canvas.innerHTML = '<h1 class="text-slate-400 text-3xl font-bold">Қозғалтқыш жүктелуде...</h1>';
        }

        // --- GAME ENGINE: END SCREEN ---
        function renderWinScreen(canvas, total, isPerfect) {
            canvas.innerHTML = `
                <div class="text-center p-12 bg-[#0b1120] border ${isPerfect?'border-green-500/50':'border-[#38bdf8]/30'} rounded-3xl shadow-2xl max-w-md w-full animate-[pop_0.5s_ease-out]">
                    <div class="text-7xl mb-6 drop-shadow-[0_0_20px_rgba(255,255,255,0.4)]" style="transform: rotate(5deg);">${isPerfect?'🏆':'👍'}</div>
                    <h1 class="text-3xl font-black text-white mb-2 tracking-tight">${isPerfect?'М мінсіз!':'ОЙЫН АЯҚТАЛДЫ'}</h1>
                    <div class="font-mono bg-[#020617] inline-block px-8 py-3 rounded-xl border border-[#1e293b] mb-10 shadow-inner">
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1">ҚОРЫТЫНДЫ ҰПАЙ</p>
                        <p class="text-3xl font-black ${isPerfect?'text-green-400':'text-[#38bdf8]'}">${state.gameData.score} / ${total}</p>
                    </div>
                    <button onclick="initGameEngine()" class="block w-full py-4 bg-[#38bdf8] hover:bg-[#0ea5e9] text-[#020617] rounded-xl font-black text-lg tracking-widest transition shadow-[0_5px_0_#0284c7] active:translate-y-[5px] active:shadow-none uppercase">ҚАЙТА КӨРУ</button>
                </div>
            `;
        }

        // --- GAME ENGINE: QUIZ ---
        function runEngineQuiz(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score === items.length);
            
            const qItem = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-4xl flex flex-col h-full animate-[slideIn_0.3s_ease-out]">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-slate-400 font-bold uppercase tracking-widest text-xs border border-[#1e293b] px-3 py-1 rounded-md">Сұрақ ${state.gameData.step + 1} из ${items.length}</span>
                        <span class="text-green-400 font-mono font-bold text-sm bg-green-900/20 px-3 py-1 border border-green-500/30 rounded-md">SCORE: ${state.gameData.score}</span>
                    </div>
                    
                    <div class="bg-[#0f172a] rounded-[2rem] shadow-[0_10px_30px_rgba(0,0,0,0.5)] flex-1 min-h-[200px] flex items-center justify-center p-8 mb-8 border border-[#1e293b]">
                        <h2 class="text-3xl lg:text-5xl font-black text-white text-center leading-tight drop-shadow-md">${qItem.q}</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${qItem.ans.map((a, i) => `
                            <button onclick="quizEngineSubmit(${i}, ${qItem.correct})" id="qbtn-${i}" class="qbtn relative overflow-hidden bg-[#1e293b] hover:bg-[#38bdf8] text-white hover:text-[#020617] border-2 border-transparent shadow-lg font-black text-xl lg:text-2xl p-6 rounded-2xl transition-all active:scale-95 flex items-center justify-center text-center group">
                                <span class="${a.length>25 ? 'text-lg' : ''}">${a}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function quizEngineSubmit(userAns, trueAns) {
            const btns = document.querySelectorAll('.qbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('pointer-events-none'); });
            
            const isCorrect = userAns === trueAns;
            if (isCorrect) state.gameData.score++;
            
            const cb = document.getElementById('qbtn-' + trueAns);
            cb.classList.add('bg-green-500', 'text-white', 'shadow-[0_0_40px_rgba(34,197,94,0.6)]', 'border-green-400');
            cb.classList.remove('bg-[#1e293b]', 'hover:bg-[#38bdf8]');
            
            if (!isCorrect) {
                const ub = document.getElementById('qbtn-' + userAns);
                ub.classList.add('bg-red-500', 'text-white', 'shadow-[0_0_40px_rgba(239,68,68,0.6)]', 'border-red-400');
                ub.classList.remove('bg-[#1e293b]', 'hover:bg-[#38bdf8]');
                ub.animate([{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}], {duration:300});
                
                // Show AI Explainer
                const errId = state.gameData.step;
                const eBtn = document.createElement('button');
                eBtn.innerHTML = '<i class="fa-solid fa-robot mr-2"></i> Түсіндіру';
                eBtn.className = 'absolute bottom-8 right-8 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-bold py-3 px-6 rounded-2xl shadow-xl hover:scale-105 transition animate-[pop_0.3s_ease-out] z-50';
                eBtn.onclick = () => { if(typeof aiExplain === 'function') aiExplain(items[errId].q, items[errId].ans[trueAns]); };
                document.getElementById('game-canvas').parentElement.appendChild(eBtn);
                
                setTimeout(() => { if(eBtn.parentElement) eBtn.remove(); state.gameData.step++; runEngineQuiz(document.getElementById('game-canvas')); }, 4500);
            } else {
                cb.animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}], {duration:300});
                setTimeout(() => { state.gameData.step++; runEngineQuiz(document.getElementById('game-canvas')); }, 1500);
            }
        }

        // --- GAME ENGINE: TRUE / FALSE (Tinder-like swipe concept via buttons) ---
        function runEngineTrueFalse(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score === items.length);
            
            const item = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col h-full items-center justify-center animate-[pop_0.4s_ease-out]">
                    <div class="bg-[#0f172a] border-4 border-[#1e293b] rounded-[3rem] p-12 w-full text-center shadow-2xl relative mb-12">
                        <div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-[#38bdf8] text-[#020617] font-black tracking-widest px-6 py-2 rounded-full shadow-[0_0_15px_rgba(56,189,248,0.5)] uppercase text-sm">
                            Факт ${state.gameData.step + 1} / ${items.length}
                        </div>
                        <h2 class="text-3xl md:text-5xl font-black text-white leading-tight mt-6">${item.statement}</h2>
                    </div>
                    
                    <div class="flex gap-8 w-full justify-center">
                        <button onclick="tfEngineSubmit(true, ${item.isTrue})" class="tfbtn flex-1 max-w-[200px] h-24 bg-green-500/10 border-2 border-green-500/50 hover:bg-green-500 hover:text-white text-green-400 font-black text-2xl uppercase rounded-3xl transition-all shadow-[0_10px_0_rgba(34,197,94,0.3)] active:translate-y-[10px] active:shadow-none">
                            ШЫНДЫҚ
                        </button>
                        <button onclick="tfEngineSubmit(false, ${item.isTrue})" class="tfbtn flex-1 max-w-[200px] h-24 bg-red-500/10 border-2 border-red-500/50 hover:bg-red-500 hover:text-white text-red-500 font-black text-2xl uppercase rounded-3xl transition-all shadow-[0_10px_0_rgba(239,68,68,0.3)] active:translate-y-[10px] active:shadow-none">
                            ЖАЛҒАН
                        </button>
                    </div>
                </div>
            `;
        }

        function tfEngineSubmit(userSelection, correctBool) {
            const btns = document.querySelectorAll('.tfbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('pointer-events-none'); });
            
            const isCorrect = userSelection === correctBool;
            if(isCorrect) state.gameData.score++;
            
            // Highlight screen briefly
            const canvasRoot = document.getElementById('game-canvas').parentElement;
            if(isCorrect){
                canvasRoot.style.boxShadow = 'inset 0 0 100px rgba(34,197,94,0.4)';
            } else {
                canvasRoot.style.boxShadow = 'inset 0 0 100px rgba(239,68,68,0.4)';
            }
            setTimeout(()=>{ canvasRoot.style.boxShadow = ''; }, 500);
            
            setTimeout(() => { state.gameData.step++; runEngineTrueFalse(document.getElementById('game-canvas')); }, 800);
        }

        // --- GAME ENGINE: ANAGRAM ---
        function runEngineAnagram(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, true);
            
            const item = items[state.gameData.step];
            if(!item.word) { state.gameData.step++; return runEngineAnagram(canvas); }
            
            let chars = item.word.split('');
            for(let i=0; i<5; i++) { chars.sort(()=>Math.random()-0.5); if(chars.join('')!==item.word) break; }
            
            canvas.innerHTML = `
                <div class="w-full max-w-4xl flex flex-col items-center z-10 animate-[slideIn_0.3s_ease-out]">
                    <div class="bg-[#0f172a] border border-[#1e293b] p-6 md:p-10 rounded-[2rem] shadow-2xl mb-12 w-full max-w-3xl text-center">
                        <span class="text-purple-400 font-black uppercase text-xs tracking-[0.3em] block mb-4">КЕҢЕС</span>
                        <span class="text-2xl md:text-3xl text-white font-bold leading-snug">${item.clue || 'Жасырылған сөзді табыңыз'}</span>
                    </div>
                    
                    <div class="flex flex-wrap justify-center gap-3 md:gap-4 mb-10" id="anagram-slots">
                        ${item.word.split('').map(() => `
                            <div class="w-14 h-14 md:w-20 md:h-20 bg-[#020617] border-b-4 border-[#334155] rounded-xl flex items-center justify-center shadow-inner slot-empty" ondragover="anagramDragOver(event)" ondrop="anagramDrop(event, true)"></div>
                        `).join('')}
                    </div>
                    
                    <div class="flex flex-wrap justify-center gap-3 md:gap-4 p-6 bg-[#0f172a] rounded-3xl border border-[#1e293b] w-full max-w-3xl min-h-[120px]" id="anagram-letters" ondragover="anagramDragOver(event)" ondrop="anagramDrop(event, false)">
                        ${chars.map((c, i) => `
                            <div draggable="true" ondragstart="anagramDrag(event, this)" id="al-${i}" data-char="${c}" class="w-14 h-14 md:w-20 md:h-20 bg-gradient-to-b from-[#1e293b] to-[#0f172a] border border-[#334155] border-b-[4px] border-b-[#020617] text-[#38bdf8] text-3xl md:text-4xl font-black flex items-center justify-center rounded-xl cursor-grab active:cursor-grabbing hover:-translate-y-1 hover:border-[#38bdf8] hover:text-white transition-all select-none drop-shadow-md">${c}</div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function anagramDrag(e, el) { e.dataTransfer.setData('text', el.id); setTimeout(()=>el.style.opacity='0.5',0); }
        window.addEventListener('dragend', (e)=>{ if(e.target.id && e.target.id.startsWith('al-')) e.target.style.opacity='1'; });
        function anagramDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect='move'; }
        
        function anagramDrop(e, isSlot) {
            e.preventDefault();
            let targetDiv = e.target;
            if(isSlot) {
                while(targetDiv && !targetDiv.classList.contains('slot-empty') && targetDiv.parentElement.id !== 'anagram-slots') {
                    if(targetDiv.tagName==='BODY') return; targetDiv = targetDiv.parentElement;
                }
                if (targetDiv && targetDiv.classList.contains('slot-empty') && targetDiv.children.length===0) {
                    const el = document.getElementById(e.dataTransfer.getData('text'));
                    if(el) { targetDiv.appendChild(el); targetDiv.classList.remove('slot-empty'); targetDiv.style.borderBottomColor='transparent'; checkAnagramWin(); }
                }
            } else {
                const pool = document.getElementById('anagram-letters');
                const el = document.getElementById(e.dataTransfer.getData('text'));
                if(el) { if(el.parentElement!==pool) el.parentElement.classList.add('slot-empty'); pool.appendChild(el); }
            }
        }

        function checkAnagramWin() {
            const slots = document.querySelectorAll('#anagram-slots > div');
            let currentStr = ''; let full = true;
            slots.forEach(s => { if(s.children.length>0) currentStr += s.children[0].dataset.char; else full=false; });
            
            if(full) {
                const target = state.gameData.runItems[state.gameData.step].word;
                if(currentStr === target) {
                    state.gameData.score++; // Anagrams are purely win/continue
                    slots.forEach((s, i) => {
                        const letter = s.children[0]; letter.setAttribute('draggable','false'); letter.classList.remove('cursor-grab');
                        setTimeout(()=>{ letter.classList.add('bg-green-500','text-white','border-green-400'); letter.classList.remove('text-[#38bdf8]','from-[#1e293b]'); letter.style.transform='scale(1.1)'; }, i*100);
                        setTimeout(()=>{ letter.style.transform='scale(1)'; }, 300+(i*100));
                    });
                    setTimeout(() => { state.gameData.step++; runEngineAnagram(document.getElementById('game-canvas')); }, 1000 + (slots.length*100));
                } else {
                    slots.forEach(s => {
                        const letter = s.children[0]; letter.classList.add('text-red-500','border-red-500');
                        letter.animate([{transform:'translate(0)'},{transform:'translate(-5px)'},{transform:'translate(5px)'},{transform:'translate(0)'}], {duration:300});
                        setTimeout(()=>{ letter.classList.remove('text-red-500','border-red-500'); }, 400);
                    });
                }
            }
        }

        // --- GAME ENGINE: ODD ONE OUT ---
        function runEngineOdd(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score === items.length);
            
            const item = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-4xl flex flex-col h-full items-center justify-center animate-[pop_0.4s_ease-out]">
                    ${item.cat ? `<div class="bg-[#0f172a] border border-[#1e293b] px-8 py-4 mb-8 rounded-full shadow-lg text-white font-bold tracking-widest uppercase text-sm">Санат: <span class="text-orange-400">${item.cat}</span></div>` : ''}
                    <h2 class="text-3xl font-black text-white text-center drop-shadow-md mb-10">Артық сөзді тап</h2>
                    
                    <div class="flex flex-wrap justify-center gap-4 w-full px-4">
                        ${item.items.map((opt, i) => `
                            <button onclick="oddEngineSubmit(${i}, ${item.oddIdx})" id="oddbtn-${i}" class="oddbtn flex-1 min-w-[150px] max-w-[250px] h-32 bg-[#1e293b] border-2 border-[#334155] rounded-3xl shadow-xl flex items-center justify-center text-xl font-bold text-slate-300 hover:text-white hover:bg-[#38bdf8] hover:border-[#0ea5e9] transition-all transform active:scale-95">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function oddEngineSubmit(userAns, trueAns) {
            const btns = document.querySelectorAll('.oddbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('opacity-50', 'pointer-events-none'); });
            
            const isCorrect = userAns === trueAns;
            if(isCorrect) state.gameData.score++;
            
            const cb = document.getElementById('oddbtn-' + trueAns);
            cb.classList.remove('opacity-50', 'bg-[#1e293b]', 'border-[#334155]');
            cb.classList.add('bg-orange-500', 'text-[#020617]', 'border-orange-400', 'shadow-[0_0_40px_rgba(249,115,22,0.6)]');
            
            if (!isCorrect) {
                const ub = document.getElementById('oddbtn-' + userAns);
                ub.classList.remove('opacity-50');
                ub.classList.add('bg-red-500', 'text-white', 'border-red-400');
                ub.animate([{transform:'rotate(-5deg)'},{transform:'rotate(5deg)'},{transform:'rotate(0)'}], {duration:300});
                
                // Show AI Explainer
                const errId = state.gameData.step;
                const eBtn = document.createElement('button');
                eBtn.innerHTML = '<i class="fa-solid fa-robot mr-2"></i> Қатені түсіндіру';
                eBtn.className = 'absolute bottom-8 right-8 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-bold py-3 px-6 rounded-2xl shadow-xl hover:scale-105 transition animate-[pop_0.3s_ease-out] z-50';
                eBtn.onclick = () => { if(typeof aiExplain === 'function') aiExplain("Бұл неге артық?", items[errId].items[trueAns]); };
                document.getElementById('game-canvas').parentElement.appendChild(eBtn);
                
                setTimeout(() => { if(eBtn.parentElement) eBtn.remove(); state.gameData.step++; runEngineOdd(document.getElementById('game-canvas')); }, 4500);
            } else {
                cb.animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}], {duration:300});
                setTimeout(() => { state.gameData.step++; runEngineOdd(document.getElementById('game-canvas')); }, 1500);
            }
        }

        // --- GAME ENGINE: MATCH ---
        let matchState = { selectedTerm: null, selectedDef: null, matchedCount: 0, blocks: [] };
        function initEngineMatch() {
            const canvas = document.getElementById('game-canvas');
            const items = state.gameData.runItems;
            
            // Build interconnected cards logic
            let terms = items.map((x, i) => ({ id: i, text: x.term, type: 'term' })).sort(()=>Math.random()-0.5);
            let defs = items.map((x, i) => ({ id: i, text: x.def, type: 'def' })).sort(()=>Math.random()-0.5);
            
            matchState = { selectedTerm: null, selectedDef: null, matchedCount: 0, total: items.length };
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col md:flex-row gap-8 items-center justify-center animate-[slideIn_0.3s_ease-out] relative w-full overflow-hidden">
                    <h2 class="absolute top-2 left-1/2 -translate-x-1/2 text-2xl font-black text-white drop-shadow-lg opacity-50 z-0">Жұптарды қосыңыз</h2>
                    <div class="flex-1 w-full max-w-sm flex flex-col gap-4 z-10" id="match-terms">
                        ${terms.map(t => `
                            <button onclick="selectMatchCard('term', ${t.id}, this)" id="term-${t.id}" class="match-card bg-[#0f172a] border-l-[8px] border-emerald-500 border border-[#1e293b] rounded-xl p-5 text-left text-white font-bold text-lg hover:bg-emerald-500/10 transition shadow-lg">
                                ${t.text}
                            </button>
                        `).join('')}
                    </div>
                    <div class="flex-1 w-full max-w-sm flex flex-col gap-4 z-10" id="match-defs">
                        ${defs.map(d => `
                            <button onclick="selectMatchCard('def', ${d.id}, this)" id="def-${d.id}" class="match-card bg-[#0f172a] border-r-[8px] border-teal-500 border border-[#1e293b] rounded-xl p-5 text-right text-slate-300 font-medium text-base hover:bg-teal-500/10 transition shadow-lg">
                                ${d.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        function selectMatchCard(type, id, el) {
            // Deselect previous of same type
            const siblings = el.parentElement.querySelectorAll('.match-card');
            siblings.forEach(s => {
                if(!s.classList.contains('matched-card')) {
                    s.classList.remove('bg-emerald-500', 'bg-teal-500', '!text-white', 'scale-105', 'shadow-[0_0_20px_rgba(16,185,129,0.5)]');
                    s.classList.add('bg-[#0f172a]');
                }
            });
            
            if(type === 'term') {
                matchState.selectedTerm = {id, el};
                el.classList.remove('bg-[#0f172a]');
                el.classList.add('bg-emerald-500', '!text-white', 'scale-105', 'shadow-[0_0_20px_rgba(16,185,129,0.5)]');
            } else {
                matchState.selectedDef = {id, el};
                el.classList.remove('bg-[#0f172a]');
                el.classList.add('bg-teal-500', '!text-white', 'scale-105', 'shadow-[0_0_20px_rgba(20,184,166,0.5)]');
            }
            
            // Check Match
            if(matchState.selectedTerm && matchState.selectedDef) {
                const isMatch = matchState.selectedTerm.id === matchState.selectedDef.id;
                const tEl = matchState.selectedTerm.el;
                const dEl = matchState.selectedDef.el;
                
                if(isMatch) {
                    // Success!
                    tEl.className = 'match-card matched-card border-l-[8px] border-green-500 bg-green-500/20 rounded-xl p-5 text-green-400 font-bold opacity-50 transition pointer-events-none scale-95';
                    dEl.className = 'match-card matched-card border-r-[8px] border-green-500 bg-green-500/20 rounded-xl p-5 text-green-400 opacity-50 transition pointer-events-none scale-95';
                    tEl.innerHTML = '<i class="fa-solid fa-check mr-2"></i>' + tEl.innerText;
                    
                    matchState.matchedCount++;
                    matchState.selectedTerm = null;
                    matchState.selectedDef = null;
                    
                    if(matchState.matchedCount === matchState.total) {
                        state.gameData.score = state.gameData.runItems.length; // Max score 
                        setTimeout(() => renderWinScreen(document.getElementById('game-canvas'), state.gameData.runItems.length, true), 1000);
                    }
                } else {
                    // Fail!
                    tEl.classList.add('bg-red-500', 'border-red-500');
                    dEl.classList.add('bg-red-500', 'border-red-500');
                    setTimeout(() => {
                        tEl.classList.remove('bg-red-500', 'border-red-500', 'bg-emerald-500', '!text-white', 'scale-105', 'shadow-[0_0_20px_rgba(16,185,129,0.5)]');
                        dEl.classList.remove('bg-red-500', 'border-red-500', 'bg-teal-500', '!text-white', 'scale-105', 'shadow-[0_0_20px_rgba(20,184,166,0.5)]');
                        tEl.classList.add('bg-[#0f172a]', 'border-emerald-500');
                        dEl.classList.add('bg-[#0f172a]', 'border-teal-500');
                    }, 500);
                    
                    matchState.selectedTerm = null;
                    matchState.selectedDef = null;
                }
            }
        }
        
        // --- GAME ENGINE: SENTENCE ---
        let sentenceState = {};
        function runEngineSentence(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score === items.length);
            const item = items[state.gameData.step];
            const words = item.phrase.split(' ').map((w,i)=>({text:w, id:i}));
            const shuffled = [...words].sort(()=>Math.random()-0.5);
            sentenceState = { words, current: [], expected: words.map(w=>w.id) };
            
            canvas.innerHTML = `
                <div class="w-full max-w-4xl flex flex-col h-full items-center justify-center animate-[slideIn_0.3s_ease-out]">
                    <h2 class="text-2xl font-black text-slate-400 mb-8 uppercase tracking-widest">Соберите предложение</h2>
                    <div id="sentence-slots" class="flex flex-wrap gap-2 mb-10 min-h-[70px] p-4 bg-[#0f172a] rounded-2xl border border-[#1e293b] w-full" ondragover="anagramDragOver(event)" ondrop="sentenceDropSlot(event)"></div>
                    <div id="sentence-pool" class="flex flex-wrap gap-3 p-4 bg-[#020617] rounded-3xl" ondragover="anagramDragOver(event)" ondrop="sentenceDropPool(event)">
                        ${shuffled.map(w => `<div draggable="true" ondragstart="anagramDrag(event, this)" id="sw-${w.id}" class="sw-btn px-6 py-3 bg-[#1e293b] border border-[#334155] rounded-xl text-[#38bdf8] font-bold text-xl cursor-grab shadow-lg transition-transform active:scale-95 hover:border-[#38bdf8]">${w.text}</div>`).join('')}
                    </div>
                </div>
            `;
        }
        function sentenceDropSlot(e) { e.preventDefault(); const el = document.getElementById(e.dataTransfer.getData('text')); if(el){ document.getElementById('sentence-slots').appendChild(el); checkSentenceWin(); } }
        function sentenceDropPool(e) { e.preventDefault(); const el = document.getElementById(e.dataTransfer.getData('text')); if(el){ document.getElementById('sentence-pool').appendChild(el); checkSentenceWin(); } }
        function checkSentenceWin() {
            const slots = document.getElementById('sentence-slots').children;
            if(slots.length === sentenceState.expected.length) {
                let ok = true;
                for(let i=0; i<slots.length; i++) { if(slots[i].id !== 'sw-'+sentenceState.expected[i]) ok = false; }
                if(ok) {
                    state.gameData.score++;
                    Array.from(slots).forEach(s => { s.classList.add('bg-green-500', 'text-white', 'border-green-400'); s.classList.remove('text-[#38bdf8]'); s.setAttribute('draggable','false'); });
                    setTimeout(()=>{ state.gameData.step++; runEngineSentence(document.getElementById('game-canvas')); }, 1000);
                } else {
                    document.getElementById('sentence-slots').animate([{transform:'translate(-5px)'},{transform:'translate(5px)'},{transform:'translate(0)'}], {duration:300});
                }
            }
        }

        // --- GAME ENGINE: BOX ---
        function runEngineBox(canvas) {
            const items = state.gameData.runItems;
            canvas.innerHTML = `
                <div class="w-full flex-col h-full items-center justify-center animate-[pop_0.4s_ease-out]">
                    <h2 class="text-3xl font-black text-center text-white mb-10 drop-shadow-lg tracking-widest uppercase">Открой все коробки!</h2>
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 max-w-4xl mx-auto px-4 mt-8">
                        ${items.map((item, i) => `
                            <button onclick="this.innerHTML='<span class=\\'text-xl font-bold text-[#020617] bg-[#38bdf8] px-4 py-2 rounded-lg drop-shadow-md\\'>${item.text}</span>'; this.classList.remove('bg-[#1e293b]', 'hover:bg-[#334155]', 'border-slate-500'); this.classList.add('bg-transparent', 'border-transparent', 'scale-110'); this.onclick=null;" class="aspect-square bg-[#1e293b] hover:bg-[#334155] border-4 border-slate-500 rounded-3xl flex items-center justify-center text-6xl shadow-2xl transition-all cursor-pointer">
                                🎁
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        // --- GAME ENGINE: WHEEL ---
        function runEngineWheel(canvas) {
            const items = state.gameData.runItems;
            canvas.innerHTML = `
                <div class="w-full flex-col h-full items-center justify-center flex animate-[pop_0.4s_ease-out]">
                    <h2 class="text-3xl font-black text-[#38bdf8] mb-12 tracking-widest uppercase">Сәттілік дөңгелегі</h2>
                    <div class="relative w-80 h-80 rounded-full border-[10px] border-[#1e293b] bg-[#0f172a] shadow-[0_0_50px_rgba(56,189,248,0.2)] overflow-hidden" id="spin-wheel">
                        ${items.map((item, i) => `
                            <div class="absolute w-[50%] h-[2px] bg-[#334155] top-1/2 left-1/2 origin-left" style="transform: rotate(${i*(360/items.length)}deg);"></div>
                            <div class="absolute text-center text-[10px] font-bold text-white uppercase left-1/2 top-[48%] origin-left" style="transform: rotate(${i*(360/items.length) + (180/items.length)}deg); width: 45%; padding-left: 10px;">${item.text}</div>
                        `).join('')}
                    </div>
                    <div class="w-0 h-0 border-l-[15px] border-l-transparent border-r-[15px] border-r-transparent border-t-[20px] border-t-red-500 absolute top-1/2 -mt-[170px] z-10"></div>
                    <button onclick="const deg = Math.floor(Math.random()*3600)+1080; document.getElementById('spin-wheel').style.transition='all 4s cubic-bezier(0.1, 0.8, 0.2, 1)'; document.getElementById('spin-wheel').style.transform='rotate('+deg+'deg)';" class="mt-12 bg-rose-500 hover:bg-rose-400 text-white px-10 py-4 rounded-full font-black text-2xl tracking-widest shadow-[0_0_20px_rgba(244,63,94,0.5)] transition-all">КРУТИТЬ</button>
                </div>
            `;
        }
        
        // --- GAME ENGINE: MEMORY ---
        let memoryState = { cards: [], flipped: [], matched: 0 };
        function initEngineMemory() {
            const canvas = document.getElementById('game-canvas');
            const items = state.gameData.runItems;
            let cards = [];
            items.forEach((x,i) => { cards.push({id: i, txt: x.pair}); cards.push({id: i, txt: x.pair2}); });
            cards.sort(()=>Math.random()-0.5);
            memoryState = { cards, flipped: [], matched: 0, total: items.length };
            
            canvas.innerHTML = `
                <div class="w-full h-full flex items-center justify-center flex-col animate-[slideIn_0.3s_ease-out]">
                    <div class="grid grid-cols-4 md:grid-cols-6 gap-4 max-w-5xl mx-auto px-4">
                        ${cards.map((c, i) => `
                            <div onclick="memoryFlip(${i})" id="mem-${i}" class="w-20 h-28 md:w-28 md:h-36 bg-[#1e293b] border-2 border-[#334155] rounded-2xl flex items-center justify-center text-4xl shadow-lg cursor-pointer transition-all transform hover:-translate-y-2 relative overflow-hidden" data-id="${c.id}" data-txt="${c.txt}">
                                <span class="opacity-0 transition-opacity absolute inset-0 flex items-center justify-center font-bold text-xl md:text-2xl text-[#020617] bg-[#38bdf8]">${c.txt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        function memoryFlip(idx) {
            const el = document.getElementById('mem-'+idx);
            if(el.classList.contains('pointer-events-none') || memoryState.flipped.includes(idx)) return;
            el.children[0].classList.remove('opacity-0'); el.classList.add('rotate-y-180');
            memoryState.flipped.push(idx);
            
            if(memoryState.flipped.length === 2) {
                const [i1, i2] = memoryState.flipped;
                const e1 = document.getElementById('mem-'+i1);
                const e2 = document.getElementById('mem-'+i2);
                if(e1.dataset.id === e2.dataset.id) {
                    memoryState.matched++;
                    document.querySelectorAll('[id^=mem-]').forEach(x=>x.classList.add('pointer-events-none')); // fast lock
                    setTimeout(()=>{
                       e1.children[0].className = 'absolute inset-0 flex items-center justify-center font-bold text-xl md:text-2xl text-white bg-green-500 scale-95 rounded-2xl transition-all';
                       e2.children[0].className = 'absolute inset-0 flex items-center justify-center font-bold text-xl md:text-2xl text-white bg-green-500 scale-95 rounded-2xl transition-all';
                       memoryState.flipped = [];
                       document.querySelectorAll('[id^=mem-]').forEach(x=> { if(!x.children[0].classList.contains('bg-green-500')) x.classList.remove('pointer-events-none') });
                       if(memoryState.matched === memoryState.total) {
                           state.gameData.score = memoryState.total;
