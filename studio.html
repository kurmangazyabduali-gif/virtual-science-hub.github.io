    <script>
        // --- 1. WEB AUDIO API SYNTHESIZER ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSfx(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    osc.frequency.setValueAtTime(1046.50, now + 0.24);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(70, now + 0.28);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(900, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'boost') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.22);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
                    osc.start(now);
                    osc.stop(now + 0.26);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    notes.forEach((freq, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'triangle';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(ctx.destination);
                        g.gain.setValueAtTime(0.18, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.35);
                    });
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(700, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                }
            } catch (e) {
                console.warn('Audio SFX error:', e);
            }
        }

        function editorAddItem() {
            const temp = state.activeTemplate;
            if (temp === 'quiz' || temp === 'blitz') state.editorData.items.push({ q: 'Жаңа сұрақ', ans: ['Нұсқа 1', 'Нұсқа 2', 'Нұсқа 3', 'Нұсқа 4'], correct: 0 });
            else if (temp === 'truefalse') state.editorData.items.push({ statement: 'Жаңа тұжырым', isTrue: true });
            else if (temp === 'match') state.editorData.items.push({ term: 'Жаңа термин', def: 'Анықтамасы' });
            else if (temp === 'flashcards') state.editorData.items.push({ front: 'Сұрақ', back: 'Жауабы' });
            else if (temp === 'odd') state.editorData.items.push({ cat: 'Жаңа санат', items: ['Сөз 1', 'Сөз 2', 'Сөз 3', 'Артық сөз'], oddIdx: 3 });
            else if (temp === 'balloon' || temp === 'falling') state.editorData.items.push({ q: 'Жаңа тапсырма', target: 'Дұрыс', distractors: ['Қате 1', 'Қате 2', 'Қате 3'] });
            else if (temp === 'spacerace') state.editorData.items.push({ q: 'Сұрақ', correct: 'Дұрыс', wrong1: 'Қате 1', wrong2: 'Қате 2' });
            else if (temp === 'anagram') state.editorData.items.push({ word: 'СӨЗ', clue: 'Анықтамасы' });
            else if (temp === 'sentence') state.editorData.items.push({ phrase: 'Жаңа сөйлем құрастыру' });
            else if (temp === 'equation') state.editorData.items.push({ formula: 'E = m·c²', q: 'Масса мен энергия заңы', correct: 'E = mc²', options: ['E = mc²', 'E = mgh', 'F = ma'] });
            else state.editorData.items.push({ text: 'Жаңа элемент' });
            
            document.getElementById('editor-items-list').innerHTML = renderEditorItems();
        }

        function editorRemoveItem(idx) {
            if (state.editorData.items.length <= 1) return alert('Кем дегенде 1 элемент болуы керек');
            state.editorData.items.splice(idx, 1);
            document.getElementById('editor-items-list').innerHTML = renderEditorItems();
        }

        // --- 7. GAME ENGINES DISPATCHER ---
        function initGameEngine() {
            state.gameData.step = 0;
            state.gameData.score = 0;
            state.gameData.combo = 1;
            state.gameData.streak = 0;
            
            const canvas = document.getElementById('game-canvas');
            if (state.editorData.settings.shuffle) {
                state.gameData.runItems = [...state.editorData.items].sort(() => Math.random() - 0.5);
            } else {
                state.gameData.runItems = [...state.editorData.items];
            }

            const temp = state.activeTemplate;
            if (temp === 'quiz') runEngineQuiz(canvas);
            else if (temp === 'truefalse') runEngineTrueFalse(canvas);
            else if (temp === 'match') { setTimeout(() => initEngineMatch(), 50); }
            else if (temp === 'flashcards') runEngineFlashcards(canvas);
            else if (temp === 'odd') runEngineOdd(canvas);
            else if (temp === 'balloon') runEngineBalloon(canvas);
            else if (temp === 'spacerace') runEngineSpaceRace(canvas);
            else if (temp === 'blitz') runEngineBlitz(canvas);
            else if (temp === 'falling') runEngineFalling(canvas);
            else if (temp === 'wheel') runEngineWheel(canvas);
            else if (temp === 'box') runEngineBox(canvas);
            else if (temp === 'buckets') runEngineBuckets(canvas);
            else if (temp === 'ladder') runEngineLadder(canvas);
            else if (temp === 'minefield') runEngineMinefield(canvas);
            else if (temp === 'timeline') runEngineTimeline(canvas);
            else if (temp === 'memory') { setTimeout(() => initEngineMemory(), 50); }
            else if (temp === 'wordsearch') runEngineWordSearch(canvas);
            else if (temp === 'cloze') runEngineCloze(canvas);
            else if (temp === 'anagram') runEngineAnagram(canvas);
            else if (temp === 'sentence') runEngineSentence(canvas);
            else if (temp === 'reaction') runEngineReaction(canvas);
            else if (temp === 'scale') runEngineScale(canvas);
            else if (temp === 'equation') runEngineEquation(canvas);
            else canvas.innerHTML = '<h2 class="text-white text-2xl font-black">Ойын сәтті жүктелді!</h2>';
        }

        function updateHudScore() {
            const el = document.getElementById('game-hud-score');
            if (el) el.innerText = state.gameData.score;
            const comboEl = document.getElementById('game-hud-combo');
            if (comboEl) {
                if (state.gameData.combo > 1) {
                    comboEl.classList.remove('hidden');
                    comboEl.innerText = `x${state.gameData.combo} COMBO`;
                } else {
                    comboEl.classList.add('hidden');
                }
            }
        }

        // --- WIN / SUMMARY SCREEN ---
        function renderWinScreen(canvas, total, isPerfect) {
            playSfx('win');
            canvas.innerHTML = `
                <div class="text-center p-10 bg-[#0b1120] border ${isPerfect?'border-green-500/60 shadow-[0_0_50px_rgba(34,197,94,0.3)]':'border-[#38bdf8]/40'} rounded-3xl shadow-2xl max-w-md w-full animate-[pop_0.5s_cubic-bezier(0.34,1.56,0.64,1)]">
                    <div class="text-7xl mb-4 animate-bounce">${isPerfect ? '🏆' : '🎉'}</div>
                    <h1 class="text-3xl font-black text-white mb-2">${isPerfect ? 'Керемет нәтиже!' : 'Ойын аяқталды!'}</h1>
                    <p class="text-slate-400 text-xs mb-6">Барлық тапсырмалар толық орындалды.</p>
                    
                    <div class="bg-[#030712] p-4 rounded-2xl border border-[#1e293b] mb-8 shadow-inner">
                        <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-1">Жинаған ұпайыңыз</p>
                        <p class="text-4xl font-black ${isPerfect ? 'text-green-400' : 'text-[#38bdf8]'}">${state.gameData.score} <span class="text-lg text-slate-500 font-bold">/ ${total}</span></p>
                    </div>
                    
                    <div class="flex gap-3">
                        <button onclick="playSfx('click'); initGameEngine()" class="flex-1 py-3.5 bg-[#38bdf8] hover:bg-[#0ea5e9] text-[#020617] rounded-xl font-black text-sm transition shadow-lg uppercase tracking-wider">
                            <i class="fa-solid fa-rotate-right mr-2"></i> Қайталау
                        </button>
                        <button onclick="playSfx('click'); navigate('templates')" class="py-3.5 px-5 bg-[#1e293b] hover:bg-[#334155] text-white rounded-xl font-bold text-sm transition border border-[#334155]">
                            Мәзір
                        </button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        //  ENGINE 1: QUIZ / ВИКТОРИНА
        // ==========================================
        function runEngineQuiz(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const qItem = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-3xl flex flex-col h-full animate-[fadeIn_0.3s_ease-out]">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-slate-400 font-extrabold uppercase tracking-widest text-xs border border-[#1e293b] px-3 py-1 rounded-lg">Сұрақ ${state.gameData.step + 1} / ${items.length}</span>
                        <div class="w-32 bg-[#0f172a] h-2 rounded-full overflow-hidden border border-[#1e293b]">
                            <div class="bg-[#38bdf8] h-full transition-all duration-300" style="width: ${((state.gameData.step)/items.length)*100}%"></div>
                        </div>
                    </div>
                    
                    <div class="bg-[#0f172a] rounded-3xl shadow-xl min-h-[160px] flex items-center justify-center p-8 mb-6 border border-[#1e293b] text-center">
                        <h2 class="text-2xl sm:text-4xl font-black text-white leading-tight">${qItem.q}</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        ${qItem.ans.map((a, i) => `
                            <button onclick="quizEngineSubmit(${i}, ${qItem.correct})" id="qbtn-${i}" class="qbtn bg-[#1e293b] hover:bg-[#38bdf8] text-white hover:text-[#020617] border-2 border-transparent font-black text-base sm:text-lg p-5 rounded-2xl transition-all active:scale-95 flex items-center justify-center text-center shadow-lg">
                                <span>${a}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function quizEngineSubmit(userAns, trueAns) {
            const btns = document.querySelectorAll('.qbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('pointer-events-none'); });
            
            const isCorrect = userAns === trueAns;
            if (isCorrect) {
                playSfx('correct');
                state.gameData.score += 1 * state.gameData.combo;
                state.gameData.streak++;
                if (state.gameData.streak % 2 === 0) state.gameData.combo++;
            } else {
                playSfx('wrong');
                state.gameData.combo = 1;
                state.gameData.streak = 0;
            }
            updateHudScore();
            
            const cb = document.getElementById('qbtn-' + trueAns);
            if (cb) {
                cb.classList.add('bg-green-500', 'text-white', 'shadow-[0_0_30px_rgba(34,197,94,0.6)]', 'border-green-400');
                cb.classList.remove('bg-[#1e293b]', 'hover:bg-[#38bdf8]');
            }
            
            if (!isCorrect) {
                const ub = document.getElementById('qbtn-' + userAns);
                if (ub) {
                    ub.classList.add('bg-red-500', 'text-white', 'border-red-400');
                    ub.classList.remove('bg-[#1e293b]', 'hover:bg-[#38bdf8]');
                }
            }
            
            setTimeout(() => {
                state.gameData.step++;
                runEngineQuiz(document.getElementById('game-canvas'));
            }, 1200);
        }

        // ==========================================
        //  ENGINE 2: TRUE / FALSE
        // ==========================================
        function runEngineTrueFalse(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const item = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-xl flex flex-col h-full items-center justify-center animate-[pop_0.35s_ease-out]">
                    <div class="bg-[#0f172a] border-2 border-[#1e293b] rounded-3xl p-10 w-full text-center shadow-2xl relative mb-10">
                        <span class="bg-[#38bdf8] text-[#020617] font-black tracking-widest px-4 py-1 rounded-full uppercase text-xs">
                            Факт ${state.gameData.step + 1} / ${items.length}
                        </span>
                        <h2 class="text-2xl sm:text-3xl font-black text-white leading-tight mt-6">${item.statement}</h2>
                    </div>
                    
                    <div class="flex gap-6 w-full justify-center">
                        <button onclick="tfEngineSubmit(true, ${item.isTrue})" class="tfbtn flex-1 max-w-[180px] h-20 bg-green-500/15 border-2 border-green-500 hover:bg-green-500 hover:text-white text-green-400 font-black text-xl uppercase rounded-2xl transition shadow-lg active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check"></i> ШЫНДЫҚ
                        </button>
                        <button onclick="tfEngineSubmit(false, ${item.isTrue})" class="tfbtn flex-1 max-w-[180px] h-20 bg-red-500/15 border-2 border-red-500 hover:bg-red-500 hover:text-white text-red-400 font-black text-xl uppercase rounded-2xl transition shadow-lg active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-xmark"></i> ЖАЛҒАН
                        </button>
                    </div>
                </div>
            `;
        }

        function tfEngineSubmit(userSelection, correctBool) {
            const btns = document.querySelectorAll('.tfbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('pointer-events-none'); });
            
            const isCorrect = userSelection === correctBool;
            if (isCorrect) {
                playSfx('correct');
                state.gameData.score++;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            
            setTimeout(() => {
                state.gameData.step++;
                runEngineTrueFalse(document.getElementById('game-canvas'));
            }, 800);
        }

        // ==========================================
        //  ENGINE 3: MATCH / ЖҰБЫН ТАП
        // ==========================================
        let matchState = { selectedTerm: null, selectedDef: null, matchedCount: 0, total: 0 };
        function initEngineMatch() {
            const canvas = document.getElementById('game-canvas');
            const items = state.gameData.runItems;
            
            let terms = items.map((x, i) => ({ id: i, text: x.term })).sort(() => Math.random() - 0.5);
            let defs = items.map((x, i) => ({ id: i, text: x.def })).sort(() => Math.random() - 0.5);
            
            matchState = { selectedTerm: null, selectedDef: null, matchedCount: 0, total: items.length };
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col md:flex-row gap-6 items-center justify-center animate-[fadeIn_0.3s_ease-out] relative">
                    <div class="flex-1 w-full max-w-sm flex flex-col gap-3">
                        <span class="text-xs font-black uppercase text-cyan-400 tracking-wider">Терминдер</span>
                        ${terms.map(t => `
                            <button onclick="selectMatchCard('term', ${t.id}, this)" id="term-${t.id}" class="match-card bg-[#0f172a] border-l-4 border-cyan-500 border border-[#1e293b] rounded-xl p-4 text-left text-white font-bold text-sm hover:bg-cyan-500/10 transition shadow-md">
                                ${t.text}
                            </button>
                        `).join('')}
                    </div>
                    <div class="flex-1 w-full max-w-sm flex flex-col gap-3">
                        <span class="text-xs font-black uppercase text-purple-400 tracking-wider">Анықтамалар</span>
                        ${defs.map(d => `
                            <button onclick="selectMatchCard('def', ${d.id}, this)" id="def-${d.id}" class="match-card bg-[#0f172a] border-r-4 border-purple-500 border border-[#1e293b] rounded-xl p-4 text-right text-slate-300 font-medium text-xs hover:bg-purple-500/10 transition shadow-md">
                                ${d.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectMatchCard(type, id, el) {
            playSfx('click');
            const siblings = el.parentElement.querySelectorAll('.match-card');
            siblings.forEach(s => {
                if (!s.classList.contains('matched-card')) {
                    s.classList.remove('bg-cyan-500', 'bg-purple-500', '!text-white', 'scale-105');
                    s.classList.add('bg-[#0f172a]');
                }
            });
            
            if (type === 'term') {
                matchState.selectedTerm = { id, el };
                el.classList.add('bg-cyan-500', '!text-white', 'scale-105');
            } else {
                matchState.selectedDef = { id, el };
                el.classList.add('bg-purple-500', '!text-white', 'scale-105');
            }
            
            if (matchState.selectedTerm && matchState.selectedDef) {
                const isMatch = matchState.selectedTerm.id === matchState.selectedDef.id;
                const tEl = matchState.selectedTerm.el;
                const dEl = matchState.selectedDef.el;
                
                if (isMatch) {
                    playSfx('correct');
                    tEl.className = 'match-card matched-card border-l-4 border-green-500 bg-green-500/20 rounded-xl p-4 text-green-400 font-bold text-xs pointer-events-none';
                    dEl.className = 'match-card matched-card border-r-4 border-green-500 bg-green-500/20 rounded-xl p-4 text-green-400 text-xs pointer-events-none';
                    tEl.innerHTML = '<i class="fa-solid fa-check mr-2"></i>' + tEl.innerText;
                    
                    matchState.matchedCount++;
                    state.gameData.score++;
                    updateHudScore();
                    
                    matchState.selectedTerm = null;
                    matchState.selectedDef = null;
                    
                    if (matchState.matchedCount === matchState.total) {
                        setTimeout(() => renderWinScreen(document.getElementById('game-canvas'), matchState.total, true), 800);
                    }
                } else {
                    playSfx('wrong');
                    tEl.classList.add('bg-red-500');
                    dEl.classList.add('bg-red-500');
                    setTimeout(() => {
                        tEl.classList.remove('bg-red-500', 'bg-cyan-500', '!text-white', 'scale-105');
                        dEl.classList.remove('bg-red-500', 'bg-purple-500', '!text-white', 'scale-105');
                        tEl.classList.add('bg-[#0f172a]');
                        dEl.classList.add('bg-[#0f172a]');
                    }, 400);
                    matchState.selectedTerm = null;
                    matchState.selectedDef = null;
                }
            }
        }

        // ==========================================
        //  ENGINE 4: FLASHCARDS 3D
        // ==========================================
        let flashcardFlipped = false;
        function runEngineFlashcards(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, true);
            
            const card = items[state.gameData.step];
            flashcardFlipped = false;
            
            canvas.innerHTML = `
                <div class="w-full max-w-lg flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">
                        Карта ${state.gameData.step + 1} / ${items.length} (Басып аударыңыз)
                    </div>
                    
                    <div onclick="toggleFlashcard()" id="fcard-inner" class="w-full h-72 cursor-pointer perspective-1000 relative rounded-3xl group">
                        <div class="w-full h-full duration-500 transform-style-3d relative rounded-3xl shadow-2xl transition-transform" id="fcard-box">
                            <!-- Front -->
                            <div class="absolute inset-0 backface-hidden bg-gradient-to-br from-[#0f172a] to-[#1e293b] border-2 border-cyan-500/40 rounded-3xl p-8 flex flex-col items-center justify-center text-center shadow-xl">
                                <span class="text-[10px] font-black uppercase tracking-widest text-cyan-400 mb-3">СҰРАҚ / ТЕРМИН</span>
                                <h2 class="text-2xl sm:text-3xl font-black text-white leading-relaxed">${card.front}</h2>
                                <span class="absolute bottom-4 text-xs text-slate-500 font-bold"><i class="fa-solid fa-rotate mr-1"></i> Жауапты көру үшін басыңыз</span>
                            </div>
                            <!-- Back -->
                            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-purple-950/80 to-[#0f172a] border-2 border-purple-500/50 rounded-3xl p-8 flex flex-col items-center justify-center text-center shadow-xl">
                                <span class="text-[10px] font-black uppercase tracking-widest text-purple-400 mb-3">ЖАУАП / ТҮСІНДІРМЕ</span>
                                <p class="text-lg sm:text-xl font-bold text-slate-100 leading-relaxed">${card.back}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex gap-4 w-full mt-8">
                        <button onclick="playSfx('click'); state.gameData.step++; runEngineFlashcards(document.getElementById('game-canvas'))" class="flex-1 py-3 bg-[#1e293b] hover:bg-[#334155] text-slate-300 font-bold text-xs rounded-xl border border-[#334155] transition">
                            Қайталау
                        </button>
                        <button onclick="playSfx('correct'); state.gameData.score++; updateHudScore(); state.gameData.step++; runEngineFlashcards(document.getElementById('game-canvas'))" class="flex-1 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-black text-xs rounded-xl shadow-lg transition">
                            Білдім! (+1)
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleFlashcard() {
            playSfx('click');
            const box = document.getElementById('fcard-box');
            flashcardFlipped = !flashcardFlipped;
            if (flashcardFlipped) box.classList.add('rotate-y-180');
            else box.classList.remove('rotate-y-180');
        }

        // ==========================================
        //  ENGINE 5: ODD ONE OUT / АРТЫҚ СӨЗ
        // ==========================================
        function runEngineOdd(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const item = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-3xl flex flex-col h-full items-center justify-center animate-[pop_0.3s_ease-out]">
                    ${item.cat ? `<div class="bg-[#0f172a] border border-[#1e293b] px-6 py-2 mb-6 rounded-full text-xs font-black uppercase text-orange-400">Санат: ${item.cat}</div>` : ''}
                    <h2 class="text-2xl sm:text-3xl font-black text-white text-center mb-8">Артық сөзді табыңыз</h2>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full">
                        ${item.items.map((opt, i) => `
                            <button onclick="oddEngineSubmit(${i}, ${item.oddIdx})" id="oddbtn-${i}" class="oddbtn h-28 bg-[#1e293b] border-2 border-[#334155] rounded-2xl shadow-lg flex items-center justify-center text-base sm:text-lg font-bold text-slate-200 hover:text-white hover:bg-orange-500 hover:border-orange-400 transition-all active:scale-95 p-3 text-center">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function oddEngineSubmit(userAns, trueAns) {
            const btns = document.querySelectorAll('.oddbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('pointer-events-none'); });
            
            const isCorrect = userAns === trueAns;
            if (isCorrect) {
                playSfx('correct');
                state.gameData.score++;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            
            const cb = document.getElementById('oddbtn-' + trueAns);
            if (cb) cb.classList.add('bg-orange-500', 'text-white', 'border-orange-400');
            
            setTimeout(() => {
                state.gameData.step++;
                runEngineOdd(document.getElementById('game-canvas'));
            }, 1000);
        }

        // ==========================================
        //  ENGINE 6: BALLOON POP (TARGET STRIKE)
        // ==========================================
        let balloonInterval = null;
        function runEngineBalloon(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const cur = items[state.gameData.step];
            const targetWord = cur.target || cur.correct;
            const allOptions = [targetWord, ...(cur.distractors || cur.wrong || [])].sort(() => Math.random() - 0.5);
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col items-center relative overflow-hidden select-none">
                    <div class="bg-[#0f172a] border border-[#1e293b] px-6 py-3 rounded-2xl mb-6 text-center shadow-xl z-10">
                        <span class="text-[10px] font-black uppercase tracking-widest text-amber-400 block mb-1">Тапсырма</span>
                        <h2 class="text-xl sm:text-2xl font-black text-white">${cur.q}</h2>
                    </div>
                    
                    <div id="balloon-arena" class="w-full flex-1 relative flex flex-wrap items-center justify-center gap-6 p-4">
                        ${allOptions.map((opt, i) => {
                            const colors = [
                                'from-rose-500 to-red-600',
                                'from-cyan-500 to-blue-600',
                                'from-emerald-500 to-green-600',
                                'from-amber-500 to-yellow-600',
                                'from-purple-500 to-indigo-600'
                            ];
                            const c = colors[i % colors.length];
                            return `
                                <div onclick="popBalloon(this, '${opt.replace(/'/g, "\\'")}', '${targetWord.replace(/'/g, "\\'")}')" class="balloon-target w-28 h-36 sm:w-36 sm:h-44 bg-gradient-to-b ${c} rounded-[50%] flex items-center justify-center p-4 text-center text-white font-black text-sm sm:text-base shadow-2xl relative cursor-pointer active:scale-90 animate-[floatSlow_3s_ease-in-out_infinite]" style="animation-delay: ${i * 0.4}s">
                                    <span class="drop-shadow-md pointer-events-none">${opt}</span>
                                    <div class="absolute -bottom-2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[10px] border-b-white/50"></div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function popBalloon(el, selected, correct) {
            if (selected === correct) {
                playSfx('pop');
                el.style.transform = 'scale(1.4)';
                el.style.opacity = '0';
                el.style.transition = 'all 0.2s ease-out';
                state.gameData.score++;
                updateHudScore();
                
                setTimeout(() => {
                    state.gameData.step++;
                    runEngineBalloon(document.getElementById('game-canvas'));
                }, 600);
            } else {
                playSfx('wrong');
                el.classList.add('shake');
                el.animate([{ transform: 'translateX(-10px)' }, { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }], { duration: 300 });
            }
        }

        // ==========================================
        //  ENGINE 7: SPACE RACE (ҒАРЫШ ЖАРЫСЫ)
        // ==========================================
        function runEngineSpaceRace(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const cur = items[state.gameData.step];
            const lanes = [cur.correct, cur.wrong1, cur.wrong2].sort(() => Math.random() - 0.5);
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col items-center relative overflow-hidden select-none">
                    <!-- Cosmic Starfield Background -->
                    <div class="bg-[#0f172a] border border-[#1e293b] px-6 py-3 rounded-2xl mb-8 text-center shadow-xl z-10">
                        <span class="text-[10px] font-black uppercase tracking-widest text-violet-400 block mb-1">Ғарыштық навигатор</span>
                        <h2 class="text-xl sm:text-2xl font-black text-white">${cur.q}</h2>
                    </div>
                    
                    <div class="w-full max-w-2xl grid grid-cols-3 gap-4 flex-1 items-center">
                        ${lanes.map((opt, i) => `
                            <div onclick="chooseSpaceGate('${opt.replace(/'/g, "\\'")}', '${cur.correct.replace(/'/g, "\\'")}')" class="h-48 rounded-3xl bg-gradient-to-b from-indigo-950/60 to-purple-900/30 border-2 border-indigo-500/30 hover:border-cyan-400 hover:scale-105 transition-all flex flex-col items-center justify-between p-4 cursor-pointer text-center group shadow-xl">
                                <span class="text-xs font-black text-slate-500 group-hover:text-cyan-400">ҚАҚПА ${i+1}</span>
                                <span class="text-base sm:text-lg font-black text-white">${opt}</span>
                                <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center text-cyan-400 group-hover:bg-cyan-400 group-hover:text-black transition">
                                    <i class="fa-solid fa-rocket"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function chooseSpaceGate(selected, correct) {
            if (selected === correct) {
                playSfx('boost');
                state.gameData.score++;
                updateHudScore();
                setTimeout(() => {
                    state.gameData.step++;
                    runEngineSpaceRace(document.getElementById('game-canvas'));
                }, 700);
            } else {
                playSfx('wrong');
                setTimeout(() => {
                    state.gameData.step++;
                    runEngineSpaceRace(document.getElementById('game-canvas'));
                }, 900);
            }
        }

        // ==========================================
        //  ENGINE 8: SPEED BLITZ x3
        // ==========================================
        let blitzTimer = null;
        let blitzTimeLeft = 20;
        function runEngineBlitz(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length || blitzTimeLeft <= 0) {
                if (blitzTimer) clearInterval(blitzTimer);
                return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            }
            
            const cur = items[state.gameData.step];
            if (!blitzTimer) {
                blitzTimeLeft = 20;
                blitzTimer = setInterval(() => {
                    blitzTimeLeft--;
                    const tEl = document.getElementById('blitz-time-hud');
                    if (tEl) tEl.innerText = blitzTimeLeft + 'с';
                    if (blitzTimeLeft <= 0) {
                        clearInterval(blitzTimer);
                        blitzTimer = null;
                        renderWinScreen(document.getElementById('game-canvas'), items.length, false);
                    }
                }, 1000);
            }
            
            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col h-full animate-[fadeIn_0.2s_ease-out]">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-xs font-black uppercase text-yellow-400 tracking-wider">БЛИЦ-РАУНД ${state.gameData.step + 1} / ${items.length}</span>
                        <div class="text-base font-mono font-black text-amber-400 bg-amber-950/40 border border-amber-500/40 px-4 py-1 rounded-full animate-pulse" id="blitz-time-hud">
                            ${blitzTimeLeft}с
                        </div>
                    </div>
                    
                    <div class="bg-[#0f172a] rounded-3xl p-8 mb-6 border-2 border-yellow-500/30 text-center shadow-2xl">
                        <h2 class="text-3xl font-black text-white">${cur.q}</h2>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3.5">
                        ${cur.ans.map((a, i) => `
                            <button onclick="blitzSubmit(${i}, ${cur.correct})" class="bg-[#1e293b] hover:bg-yellow-400 hover:text-[#020617] text-white font-black text-lg p-5 rounded-2xl transition shadow-lg">
                                ${a}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function blitzSubmit(ans, correct) {
            if (ans === correct) {
                playSfx('correct');
                state.gameData.score++;
                blitzTimeLeft += 2; // Bonus time!
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            state.gameData.step++;
            runEngineBlitz(document.getElementById('game-canvas'));
        }

        // ==========================================
        //  ENGINE 9: FALLING ANSWERS / METEOR DEFENSE
        // ==========================================
        function runEngineFalling(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const cur = items[state.gameData.step];
            const all = [cur.correct || cur.target, ...(cur.wrong || cur.distractors || [])].sort(() => Math.random() - 0.5);
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col items-center relative overflow-hidden">
                    <div class="bg-[#0f172a] border border-[#1e293b] px-6 py-3 rounded-2xl mb-8 text-center shadow-xl">
                        <span class="text-[10px] font-black uppercase tracking-widest text-sky-400 block mb-1">Метеорит қорғанысы</span>
                        <h2 class="text-xl sm:text-2xl font-black text-white">${cur.q}</h2>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full max-w-3xl flex-1 items-center">
                        ${all.map((opt, i) => `
                            <button onclick="fallingCatch('${opt.replace(/'/g, "\\'")}', '${(cur.correct||cur.target).replace(/'/g, "\\'")}')" class="h-32 bg-gradient-to-b from-sky-900/40 to-[#0f172a] border-2 border-sky-500/40 hover:border-sky-400 hover:scale-105 rounded-2xl text-white font-black text-base p-4 transition-all shadow-xl flex flex-col items-center justify-center gap-2">
                                <i class="fa-solid fa-meteor text-sky-400 text-xl"></i>
                                <span>${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function fallingCatch(sel, target) {
            if (sel === target) {
                playSfx('correct');
                state.gameData.score++;
                updateHudScore();
                setTimeout(() => {
                    state.gameData.step++;
                    runEngineFalling(document.getElementById('game-canvas'));
                }, 600);
            } else {
                playSfx('wrong');
            }
        }

        // ==========================================
        //  ENGINE 10: WHEEL OF FORTUNE / РУЛЕТКА
        // ==========================================
        function runEngineWheel(canvas) {
            const items = state.gameData.runItems;
            canvas.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center animate-[pop_0.4s_ease-out]">
                    <h2 class="text-2xl font-black text-[#38bdf8] mb-8 tracking-widest uppercase">Сәттілік дөңгелегі</h2>
                    <div class="relative w-72 h-72 sm:w-80 sm:h-80 rounded-full border-[8px] border-[#1e293b] bg-[#0f172a] shadow-[0_0_50px_rgba(56,189,248,0.3)] overflow-hidden" id="spin-wheel">
                        ${items.map((item, i) => `
                            <div class="absolute w-[50%] h-[2px] bg-[#334155] top-1/2 left-1/2 origin-left" style="transform: rotate(${i*(360/items.length)}deg);"></div>
                            <div class="absolute text-center text-[10px] font-black text-white uppercase left-1/2 top-[47%] origin-left" style="transform: rotate(${i*(360/items.length) + (180/items.length)}deg); width: 46%; padding-left: 8px;">${item.text}</div>
                        `).join('')}
                    </div>
                    <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[22px] border-t-rose-500 absolute top-1/2 -mt-[165px] z-10 drop-shadow"></div>
                    <button onclick="spinRouletteWheel()" class="mt-8 bg-rose-500 hover:bg-rose-400 text-white px-8 py-3.5 rounded-full font-black text-lg tracking-widest shadow-[0_0_25px_rgba(244,63,94,0.6)] transition-all active:scale-95">
                        АЙНАЛДЫРУ
                    </button>
                </div>
            `;
        }

        function spinRouletteWheel() {
            playSfx('boost');
            const deg = Math.floor(Math.random() * 3600) + 1440;
            const w = document.getElementById('spin-wheel');
            w.style.transition = 'transform 4s cubic-bezier(0.12, 0.8, 0.15, 1)';
            w.style.transform = `rotate(${deg}deg)`;
            setTimeout(() => {
                playSfx('win');
                state.gameData.score += 50;
                updateHudScore();
            }, 4100);
        }

        // ==========================================
        //  ENGINE 11: MYSTERY BOX / ҚОРАПТАР
        // ==========================================
        function runEngineBox(canvas) {
            const items = state.gameData.runItems;
            canvas.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center animate-[pop_0.3s_ease-out]">
                    <h2 class="text-2xl font-black text-center text-white mb-8 tracking-widest uppercase">Құпия қорапты ашыңыз</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-6 max-w-2xl w-full">
                        ${items.map((item, i) => `
                            <button onclick="openMysteryBox(this, '${item.text.replace(/'/g, "\\'")}')" class="aspect-square bg-gradient-to-br from-[#1e293b] to-[#0f172a] border-2 border-[#334155] hover:border-teal-400 rounded-3xl flex flex-col items-center justify-center text-5xl shadow-xl transition-all cursor-pointer group hover:scale-105">
                                <span class="group-hover:animate-bounce">🎁</span>
                                <span class="text-[10px] font-bold text-slate-400 mt-2">Қорап ${i+1}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openMysteryBox(el, text) {
            playSfx('pop');
            el.innerHTML = `<span class="text-base font-black text-[#020617] bg-teal-400 p-4 rounded-2xl shadow-lg leading-tight">${text}</span>`;
            el.classList.add('scale-105', '!border-teal-400');
            el.onclick = null;
            state.gameData.score += 20;
            updateHudScore();
        }

        // ==========================================
        //  ENGINE 12: CATEGORY BUCKETS / САНАТТАР СЕБЕТІ
        // ==========================================
        let bucketState = { elements: [], curIdx: 0, bA: '', bB: '' };
        function runEngineBuckets(canvas) {
            const items = state.gameData.runItems;
            const data = items[0] || { bucketA: 'Санат A', bucketB: 'Санат B', elements: [] };
            bucketState = { elements: [...data.elements], curIdx: 0, bA: data.bucketA, bB: data.bucketB };
            renderBucketStep(canvas);
        }

        function renderBucketStep(canvas) {
            if (bucketState.curIdx >= bucketState.elements.length) {
                return renderWinScreen(canvas, bucketState.elements.length, state.gameData.score >= bucketState.elements.length);
            }
            
            const curEl = bucketState.elements[bucketState.curIdx];
            
            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col items-center justify-center animate-[fadeIn_0.3s_ease-out]">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Элемент ${bucketState.curIdx + 1} / ${bucketState.elements.length}</span>
                    
                    <!-- Item Card -->
                    <div class="bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border-2 border-cyan-400/50 rounded-3xl p-8 mb-8 text-center shadow-2xl w-full">
                        <h2 class="text-3xl font-black text-white">${curEl.text}</h2>
                    </div>
                    
                    <!-- 2 Buckets -->
                    <div class="grid grid-cols-2 gap-6 w-full">
                        <button onclick="placeInBucket('A', '${curEl.b}')" class="h-36 bg-[#0f172a] border-2 border-cyan-500/40 hover:bg-cyan-500 hover:text-black rounded-3xl text-white font-black text-lg p-4 transition shadow-xl flex flex-col items-center justify-center gap-2 group">
                            <i class="fa-solid fa-box text-cyan-400 group-hover:text-black text-2xl"></i>
                            <span>${bucketState.bA}</span>
                        </button>
                        <button onclick="placeInBucket('B', '${curEl.b}')" class="h-36 bg-[#0f172a] border-2 border-purple-500/40 hover:bg-purple-500 hover:text-black rounded-3xl text-white font-black text-lg p-4 transition shadow-xl flex flex-col items-center justify-center gap-2 group">
                            <i class="fa-solid fa-box text-purple-400 group-hover:text-black text-2xl"></i>
                            <span>${bucketState.bB}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function placeInBucket(userChoice, correctB) {
            if (userChoice === correctB) {
                playSfx('correct');
                state.gameData.score++;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            bucketState.curIdx++;
            renderBucketStep(document.getElementById('game-canvas'));
        }

        // ==========================================
        //  ENGINE 13: RANK LADDER / РАНЖИРЛЕУ
        // ==========================================
        let ladderSteps = [];
        function runEngineLadder(canvas) {
            const data = state.gameData.runItems[0] || { title: 'Реттеңіз', steps: [] };
            ladderSteps = [...data.steps].sort(() => Math.random() - 0.5);
            
            canvas.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                    <h2 class="text-xl font-black text-white mb-6 text-center">${data.title}</h2>
                    
                    <div class="w-full space-y-2.5 mb-6" id="ladder-list">
                        ${ladderSteps.map((st, i) => `
                            <div class="flex items-center justify-between p-3.5 bg-[#0f172a] border border-[#1e293b] rounded-2xl text-white font-bold text-sm shadow-md">
                                <span class="w-6 h-6 rounded-full bg-[#1e293b] flex items-center justify-center text-xs text-lime-400 font-mono">${i+1}</span>
                                <span class="flex-1 px-4">${st}</span>
                                <div class="flex gap-1">
                                    <button onclick="moveLadderItem(${i}, -1)" class="w-8 h-8 rounded-lg bg-[#1e293b] hover:bg-[#334155] text-slate-300 flex items-center justify-center"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                                    <button onclick="moveLadderItem(${i}, 1)" class="w-8 h-8 rounded-lg bg-[#1e293b] hover:bg-[#334155] text-slate-300 flex items-center justify-center"><i class="fa-solid fa-arrow-down text-xs"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <button onclick="checkLadderWin()" class="w-full py-3.5 bg-lime-500 hover:bg-lime-400 text-[#020617] font-black rounded-xl text-sm transition uppercase tracking-wider shadow-lg">
                        Тексеру
                    </button>
                </div>
            `;
        }

        function moveLadderItem(idx, dir) {
            playSfx('click');
            const target = idx + dir;
            if (target < 0 || target >= ladderSteps.length) return;
            const temp = ladderSteps[idx];
            ladderSteps[idx] = ladderSteps[target];
            ladderSteps[target] = temp;
            runEngineLadder(document.getElementById('game-canvas'));
        }

        function checkLadderWin() {
            const original = state.gameData.runItems[0].steps;
            const isCorrect = ladderSteps.every((val, idx) => val === original[idx]);
            if (isCorrect) {
                playSfx('correct');
                state.gameData.score = 100;
                updateHudScore();
                renderWinScreen(document.getElementById('game-canvas'), 100, true);
            } else {
                playSfx('wrong');
                alert('Реті әлі дұрыс емес, қайта көріңіз!');
            }
        }

        // ==========================================
        //  ENGINE 14: MINEFIELD / ҚАУІПСІЗ ЖОЛ
        // ==========================================
        function runEngineMinefield(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const cur = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-lg flex flex-col items-center justify-center animate-[pop_0.3s_ease-out]">
                    <span class="text-xs font-black uppercase text-emerald-400 tracking-wider mb-2">Мина алаңы: Қадам ${state.gameData.step + 1} / ${items.length}</span>
                    <p class="text-xs text-slate-400 mb-6 text-center">Егер тұжырым АҚИҚАТ болса — қадам жасаңыз, егер ЖАЛҒАН болса — айналып өтіңіз!</p>
                    
                    <div class="bg-[#0f172a] border-2 border-emerald-500/40 rounded-3xl p-8 mb-8 text-center shadow-2xl w-full">
                        <h2 class="text-2xl font-black text-white leading-relaxed">${cur.text}</h2>
                    </div>
                    
                    <div class="flex gap-4 w-full">
                        <button onclick="minefieldStep(true, ${cur.safe})" class="flex-1 py-4 bg-emerald-500 hover:bg-emerald-400 text-black font-black text-sm rounded-2xl shadow-lg transition">
                            <i class="fa-solid fa-shoe-prints mr-2"></i> Қадам жасау (Ақиқат)
                        </button>
                        <button onclick="minefieldStep(false, ${cur.safe})" class="flex-1 py-4 bg-[#1e293b] hover:bg-[#334155] text-slate-300 font-bold text-sm rounded-2xl border border-[#334155] transition">
                            Айналып өту (Жалған)
                        </button>
                    </div>
                </div>
            `;
        }

        function minefieldStep(userStep, isSafe) {
            const success = (userStep && isSafe) || (!userStep && !isSafe);
            if (success) {
                playSfx('correct');
                state.gameData.score++;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            state.gameData.step++;
            runEngineMinefield(document.getElementById('game-canvas'));
        }

        // ==========================================
        //  ENGINE 15: TIMELINE / УАҚЫТ ЖЕЛІСІ
        // ==========================================
        function runEngineTimeline(canvas) {
            const items = state.gameData.runItems;
            const sorted = [...items].sort((a,b) => parseInt(a.year) - parseInt(b.year));
            
            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                    <h2 class="text-2xl font-black text-amber-400 mb-8 uppercase tracking-widest">Хронологиялық уақыт желісі</h2>
                    
                    <div class="relative border-l-4 border-amber-500/40 ml-4 space-y-6 w-full">
                        ${sorted.map((ev, i) => `
                            <div class="ml-6 relative bg-[#0f172a] p-4 rounded-2xl border border-[#1e293b] shadow-lg flex items-center justify-between">
                                <div class="absolute -left-[35px] w-6 h-6 rounded-full bg-amber-500 border-4 border-[#020617]"></div>
                                <div>
                                    <span class="text-xs font-black text-amber-400 font-mono">${ev.year} жыл</span>
                                    <h3 class="text-sm font-bold text-white mt-1">${ev.title}</h3>
                                </div>
                                <i class="fa-solid fa-circle-check text-green-400 text-lg"></i>
                            </div>
                        `).join('')}
                    </div>
                    
                    <button onclick="playSfx('win'); state.gameData.score=50; updateHudScore(); renderWinScreen(document.getElementById('game-canvas'), 50, true)" class="mt-8 py-3 px-8 bg-amber-500 text-black font-black text-sm rounded-xl uppercase tracking-wider shadow-lg">
                        Аяқтау
                    </button>
                </div>
            `;
        }

        // ==========================================
        //  ENGINE 16: MEMORY / ЖАД МАТРИЦАСЫ
        // ==========================================
        let memoryState = { cards: [], flipped: [], matched: 0, total: 0 };
        function initEngineMemory() {
            const canvas = document.getElementById('game-canvas');
            const items = state.gameData.runItems;
            let cards = [];
            items.forEach((x, i) => {
                cards.push({ id: i, txt: x.pair });
                cards.push({ id: i, txt: x.pair2 });
            });
            cards.sort(() => Math.random() - 0.5);
            memoryState = { cards, flipped: [], matched: 0, total: items.length };
            
            canvas.innerHTML = `
                <div class="w-full h-full flex items-center justify-center flex-col animate-[fadeIn_0.3s_ease-out]">
                    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 max-w-4xl mx-auto">
                        ${cards.map((c, i) => `
                            <div onclick="memoryFlip(${i})" id="mem-${i}" class="w-20 h-28 sm:w-24 sm:h-32 bg-[#1e293b] border-2 border-[#334155] rounded-2xl flex items-center justify-center text-3xl shadow-lg cursor-pointer transition-all hover:scale-105 relative overflow-hidden" data-id="${c.id}" data-txt="${c.txt}">
                                <span class="opacity-0 transition-opacity absolute inset-0 flex items-center justify-center font-bold text-sm text-[#020617] bg-[#38bdf8] p-2 text-center">${c.txt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function memoryFlip(idx) {
            playSfx('click');
            const el = document.getElementById('mem-' + idx);
            if (el.classList.contains('pointer-events-none') || memoryState.flipped.includes(idx)) return;
            
            el.children[0].classList.remove('opacity-0');
            memoryState.flipped.push(idx);
            
            if (memoryState.flipped.length === 2) {
                const [i1, i2] = memoryState.flipped;
                const e1 = document.getElementById('mem-' + i1);
                const e2 = document.getElementById('mem-' + i2);
                
                if (e1.dataset.id === e2.dataset.id) {
                    playSfx('correct');
                    memoryState.matched++;
                    state.gameData.score++;
                    updateHudScore();
                    
                    e1.children[0].className = 'absolute inset-0 flex items-center justify-center font-bold text-sm text-white bg-green-500 rounded-2xl';
                    e2.children[0].className = 'absolute inset-0 flex items-center justify-center font-bold text-sm text-white bg-green-500 rounded-2xl';
                    e1.classList.add('pointer-events-none');
                    e2.classList.add('pointer-events-none');
                    memoryState.flipped = [];
                    
                    if (memoryState.matched === memoryState.total) {
                        setTimeout(() => renderWinScreen(document.getElementById('game-canvas'), memoryState.total, true), 800);
                    }
                } else {
                    playSfx('wrong');
                    setTimeout(() => {
                        e1.children[0].classList.add('opacity-0');
                        e2.children[0].classList.add('opacity-0');
                        memoryState.flipped = [];
                    }, 700);
                }
            }
        }

        // ==========================================
        //  ENGINE 17: WORD SEARCH / ФИЛВОРД
        // ==========================================
        function runEngineWordSearch(canvas) {
            const data = state.gameData.runItems[0] || { words: ['АТОМ', 'КҮШ', 'МАССА'], hint: 'Терминдер' };
            
            canvas.innerHTML = `
                <div class="w-full max-w-lg flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                    <span class="text-xs font-black uppercase text-fuchsia-400 tracking-wider mb-2">Филворд: ${data.hint}</span>
                    <p class="text-xs text-slate-400 mb-6">Төмендегі сөздерді тауып белгілеңіз:</p>
                    
                    <div class="flex flex-wrap gap-2 mb-6">
                        ${data.words.map(w => `
                            <span id="ws-word-${w}" class="px-3 py-1 bg-[#1e293b] border border-[#334155] rounded-lg text-white font-bold text-xs">${w}</span>
                        `).join('')}
                    </div>
                    
                    <!-- 6x6 Letter Grid Demo -->
                    <div class="grid grid-cols-6 gap-2 bg-[#0f172a] p-4 rounded-3xl border border-[#1e293b] shadow-2xl">
                        ${['А','Т','О','М','Қ','Ы','К','Ү','Ш','Ғ','І','Н','М','А','С','С','А','Р','Ф','О','Т','О','Н','З','Б','В','Г','Д','Е','Ж','П','Р','С','Т','У','Ф'].map(ch => `
                            <button onclick="this.classList.toggle('bg-fuchsia-500'); this.classList.toggle('text-white'); playSfx('click');" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-[#030712] border border-[#1e293b] text-slate-200 font-black text-sm flex items-center justify-center transition hover:border-fuchsia-400">
                                ${ch}
                            </button>
                        `).join('')}
                    </div>
                    
                    <button onclick="playSfx('win'); state.gameData.score = data.words.length; updateHudScore(); renderWinScreen(document.getElementById('game-canvas'), data.words.length, true)" class="mt-6 w-full py-3 bg-fuchsia-500 hover:bg-fuchsia-400 text-white font-black text-xs rounded-xl uppercase tracking-wider transition">
                        Сөздер табылды!
                    </button>
                </div>
            `;
        }

        // ==========================================
        //  ENGINE 18: CLOZE / БОС ОРЫНДАР
        // ==========================================
        function runEngineCloze(canvas) {

        // --- 8. AI GENERATOR & ASSISTANT LOGIC ---
        const AI_API_KEY = localStorage.getItem('ai_api_key') || localStorage.getItem('gemini_api_key') || atob('c2stWURjaEdfRFpxamtuVk5zdXlKd1NhQQ==');
        const FALLBACK_GEMINI_KEY = atob('QVEuQWI4Uk42SnZ1V19xZ0FmSlpBaURwbE1EbEdxR0tvYlRiZ3hMc2l3aWI0c1BNZXJHQnc=');
        
        async function fetchGemini(prompt, sysPrompt) {
            // 1. OpenAI-compatible
            if (AI_API_KEY && AI_API_KEY.startsWith('sk-')) {
                try {
                    const res = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + AI_API_KEY
                        },
                        body: JSON.stringify({
                            model: 'gpt-4o-mini',
                            messages: [
                                ...(sysPrompt ? [{ role: 'system', content: sysPrompt }] : []),
                                { role: 'user', content: prompt }
                            ],
                            temperature: 0.7
                        })
                    });
                    const data = await res.json();
                    if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
                        return data.choices[0].message.content;
                    }
                } catch(e) { 
                    console.warn('OpenAI request failed, fallback to Gemini...', e); 
                }
            }

            // 2. Google Gemini
            const activeGeminiKey = (AI_API_KEY && (AI_API_KEY.startsWith('AQ.') || AI_API_KEY.startsWith('AIzaSy'))) ? AI_API_KEY : FALLBACK_GEMINI_KEY;
            const models = ['gemini-2.5-flash', 'gemini-1.5-flash-latest'];
            const fullPrompt = sysPrompt ? (sysPrompt + '\n\n' + prompt) : prompt;

            for (const model of models) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${activeGeminiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: fullPrompt }] }],
                            generationConfig: { temperature: 0.7 }
                        })
                    });
                    const data = await res.json();
                    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) {
                        return data.candidates[0].content.parts[0].text;
                    }
                } catch(e) { 
                    console.warn(`Model ${model} failed, trying next...`, e); 
                }
            }
            return "Жүйеден жауап алу мүмкін болмады. Қайталап көріңіз.";
        }

        function toggleAI() { 
            document.getElementById('ai-modal').classList.toggle('active');

        function appendAIMsg(text, sender) {
            const m = document.createElement('div');
            m.className = `msg ${sender}`;
            m.innerHTML = text;

            container.appendChild(m);
            container.scrollTop = container.scrollHeight;
        }
        
        async function sendAIMsg() {
            const inp = document.getElementById('ai-input');
            const txt = inp.value.trim();
            if (!txt) return;
            appendAIMsg(txt, 'user');
            inp.value = '';
            
            const msgObj = document.createElement('div');
            msgObj.className = 'msg bot flex gap-2 items-center';
            msgObj.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-[#38bdf8]"></i> Ойлануда...';
            document.getElementById('ai-msgs').appendChild(msgObj);
            document.getElementById('ai-msgs').scrollTop = document.getElementById('ai-msgs').scrollHeight;
            
            const sysPrompt = "Сенің есімің — AshyqLab Нейро-Көмекшісі. Сен мұғалімдер мен оқушыларға интерактивті ойындар құрастыруға көмектесесің. Қысқа, нақты және мейірімді жауап бер. Сұрақ: " + txt;
            let ans = await fetchGemini(sysPrompt);
            msgObj.innerHTML = ans.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            document.getElementById('ai-msgs').scrollTop = document.getElementById('ai-msgs').scrollHeight;
        }

        async function aiOpenGenerator(event) {
            const topic = prompt('Қандай тақырып бойынша ойын сұрақтарын құрастырайық? (Мысалы: Химиялық элементтер, Жарық құбылыстары, ДНҚ құрылымы, Астана тарихы):');
            if (!topic) return;
            
            const btnI = event.currentTarget.querySelector('i');
            if (btnI) btnI.classList.add('fa-spin');
            
            let temp = state.activeTemplate || 'quiz';
            let jsonFormat = '[{"q":"Сұрақ","ans":["Нұсқа 1","Нұсқа 2","Нұсқа 3","Дұрыс нұсқа"],"correct":3}]';
            
            if (temp === 'truefalse') jsonFormat = '[{"statement":"Тұжырым мәтіні","isTrue":true}]';
            else if (temp === 'match') jsonFormat = '[{"term":"Термин","def":"Анықтамасы"}]';
            else if (temp === 'flashcards') jsonFormat = '[{"front":"Сұрақ немесе термин","back":"Жауабы"}]';
            else if (temp === 'odd') jsonFormat = '[{"cat":"Санат атауы","items":["Сөз 1","Сөз 2","Сөз 3","Артық сөз"],"oddIdx":3}]';
            else if (temp === 'balloon' || temp === 'falling') jsonFormat = '[{"q":"Сұрақ","target":"Дұрыс жауап","distractors":["Қате 1","Қате 2","Қате 3"]}]';
            else if (temp === 'spacerace') jsonFormat = '[{"q":"Ғарыштық сұрақ","correct":"Дұрыс жауап","wrong1":"Қате 1","wrong2":"Қате 2"}]';
            else if (temp === 'anagram') jsonFormat = '[{"word":"СӨЗ","clue":"Сөздің анықтамасы"}]';
            else if (temp === 'sentence') jsonFormat = '[{"phrase":"Дұрыс сөйлем құрастыру"}]';
            else if (temp === 'equation') jsonFormat = '[{"formula":"F = ma","q":"Есеп шарты","correct":"20 Н","options":["10 Н","20 Н","30 Н","40 Н"]}]';

            const sysPrompt = `Сен мектепке арналған білім беру ойындарының сарапшысысың. Мына тақырып бойынша: "${topic}" қазақ тілінде СТРОГО валидті JSON-массив түрінде 4 элементтен тұратын контент дайында. Әр элементтің форматы дәл мынадай болуы міндетті: ${jsonFormat}. Тек таза JSON-массив қайтар, ешқандай түсініктеме немесе маркдаунсыз!`;

            try {
                let ans = await fetchGemini(sysPrompt);
                let cleanJson = ans.replace(/```json/gi, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(cleanJson);
                
                state.editorData.title = `AI: ${topic}`;
                state.editorData.items = parsed;
                
                render();
                toggleAI();
                appendAIMsg(`✨ Тамаша! "${topic}" тақырыбы бойынша ойын сұрақтары сәтті генерацияланды. "Ойынды бастау" түймесін басыңыз!`, 'bot');
            } catch(e) {
                console.error(e);
                alert("AI генерациясы кезінде қателік кетті. Тақырыпты нақтырақ жазып көріңіз.");
            } finally {
                if (btnI) btnI.classList.remove('fa-spin');
            }
        }

        // Initialize on Load
        window.onload = render;
    </script>

            if (currentLang === 'ru') btns[0].classList.add('active');
            else if (currentLang === 'kk') btns[1].classList.add('active');
            else if (currentLang === 'en') btns[2].classList.add('active');

            document.body.appendChild(switcher);
        }
    })();

    function changeLangGlobal(lang) {
        localStorage.setItem('vsh-lang', lang);
        var gtrans = '/ru/' + lang;
        if (lang === 'ru') { 
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            if (location.hostname) {
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
            }
        } else {
            document.cookie = "googtrans=" + gtrans + "; path=/";
            if (location.hostname) document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
        }
        location.reload();
    }
    </script>
