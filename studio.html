    <style>
        :root {
            --brand-primary: #1d4ed8;
            --brand-primary-hover: #1e40af;
            --brand-accent: #2563eb;
            --bg-canvas: #f8fafc;
            --surface-white: #ffffff;
            --surface-card: #ffffff;
            --surface-muted: #f1f5f9;
            --border-subtle: #e2e8f0;
            --border-strong: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-dim: #64748b;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-canvas); 
            color: var(--text-main); 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { 0% { transform: scale(0.92); opacity: 0; } 60% { transform: scale(1.03); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        
        /* Official Executive Panels & Cards */
        .glass-panel { 
            background: #ffffff; 
            border: 1px solid var(--border-subtle); 
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); 
        }
        .glass-card { 
            background: #ffffff; 
            border: 1px solid var(--border-subtle); 
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04); 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover { 
            border-color: #93c5fd; 
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px -5px rgba(29, 78, 216, 0.08); 
        }
        .neon-btn { 
            background: #1d4ed8; 
            color: #ffffff; 
            border: 1px solid #1e40af; 
            font-weight: 700; 
            box-shadow: 0 2px 6px rgba(29, 78, 216, 0.2); 
            transition: all 0.2s ease;
        }
        .neon-btn:hover { 
            background: #1e40af; 
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3); 
            transform: translateY(-1px); 
        }
        .neon-text { 
            color: #1d4ed8; 
            font-weight: 800;
        }
        
        .template-card { 
            background: #ffffff; 
            border: 1px solid var(--border-subtle); 
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03); 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .template-card:hover { 
            border-color: #3b82f6; 
            transform: translateY(-4px); 
            box-shadow: 0 16px 30px -8px rgba(29, 78, 216, 0.12); 
        }
        
        /* Light Scrollbar */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .slot-empty { 
            background-color: #f8fafc; 
            border-bottom: 4px dashed #3b82f6; 
        }
        .min-h-canvas { min-height: clamp(520px, 72vh, 850px); }
        
        /* Interactive Game Elements */
        .balloon-target { 
            transition: transform 0.15s ease, filter 0.15s ease; 
            cursor: pointer; 
            user-select: none; 
            box-shadow: 0 8px 20px -4px rgba(0,0,0,0.15);
        }
        .balloon-target:hover { transform: scale(1.06); filter: brightness(1.08); }
        
        /* 3D Flip Card */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Official AI Assistant Widget */
        .ai-fab { 
            position: fixed; 
            bottom: 2rem; 
            right: 2rem; 
            width: 58px; 
            height: 58px; 
            background: linear-gradient(135deg, #1d4ed8, #2563eb); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 22px; 
            color: white; 
            box-shadow: 0 8px 24px rgba(29, 78, 216, 0.35); 
            cursor: pointer; 
            z-index: 9999; 
            border: 2px solid rgba(255,255,255,0.8); 
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .ai-fab:hover { transform: scale(1.1); box-shadow: 0 12px 30px rgba(29, 78, 216, 0.45); }
        
        .ai-modal { 
            position: fixed; 
            bottom: 92px; 
            right: 2rem; 
            width: 380px; 
            max-width: calc(100vw - 2rem); 
            height: 530px; 
            background: #ffffff; 
            border: 1px solid var(--border-subtle); 
            border-radius: 20px; 
            z-index: 9998; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.15); 
            transform: translateY(16px) scale(0.96); 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .ai-modal.active { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
        
        .ai-header { 
            background: #f8fafc; 
            padding: 14px 18px; 
            border-bottom: 1px solid var(--border-subtle); 
            border-radius: 20px 20px 0 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .ai-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fafbfc; }
        .msg { max-width: 86%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; animation: fadeIn 0.2s ease-out; }
        .msg.bot { background: #ffffff; border: 1px solid var(--border-subtle); align-self: flex-start; border-bottom-left-radius: 3px; color: var(--text-main); box-shadow: 0 1px 3px rgba(15,23,42,0.04); }
        .msg.user { background: #1d4ed8; align-self: flex-end; border-bottom-right-radius: 3px; color: white; }
        .ai-input-area { padding: 12px 14px; border-top: 1px solid var(--border-subtle); display: flex; gap: 8px; background: #ffffff; border-radius: 0 0 20px 20px; }
        .ai-input { flex: 1; background: #f8fafc; border: 1px solid var(--border-strong); border-radius: 10px; padding: 9px 12px; color: var(--text-main); outline: none; transition: border 0.2s; font-size: 13.5px; }
        .ai-input:focus { border-color: var(--brand-primary); background: #ffffff; }
        .ai-send { background: #1d4ed8; border: none; width: 38px; height: 38px; border-radius: 10px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, transform 0.15s; }
        .ai-send:hover { background: #1e40af; }
        .ai-send:active { transform: scale(0.94); }
        
        /* Top Navigation Link Pills */
        .nav-pill-btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 13.5px; transition: all 0.15s; color: var(--text-muted); }
        .nav-pill-btn:hover { background: #f1f5f9; color: var(--text-main); }
        .nav-pill-btn.active { background: #eff6ff; color: #1d4ed8; font-weight: 700; border: 1px solid #bfdbfe; }

    <script>
        // --- 1. WEB AUDIO API SYNTHESIZER ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSfx(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    osc.frequency.setValueAtTime(1046.50, now + 0.24);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(70, now + 0.28);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(900, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'boost') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.22);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
                    osc.start(now);
                    osc.stop(now + 0.26);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    notes.forEach((freq, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'triangle';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(ctx.destination);
                        g.gain.setValueAtTime(0.15, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.35);
                    });
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(700, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                }
            } catch (e) {
                console.warn('Audio SFX error:', e);
            }
        }

                if (diff !== 'all' && t.diff !== diff) return false;
                return true;
            });

                const diffColor = t.diff === 'EASY' ? 'text-emerald-700 border-emerald-200 bg-emerald-50' : t.diff === 'MED' ? 'text-amber-700 border-amber-200 bg-amber-50' : 'text-rose-700 border-rose-200 bg-rose-50';

        function renderEditorItems() {

                } else if (temp === 'odd') {

                        <input type="text" value="${(item.cat||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].cat = this.value" placeholder="Санат атауы (Мысалы: Инертті газдар)" class="w-full p-2.5 mb-2.5 bg-white border border-slate-300 rounded-xl outline-none font-bold text-slate-900 text-xs focus:border-blue-600 shadow-sm">
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            ${(item.items||['','','','']).map((a, i) => `
                                <div class="relative">
                                    <input type="radio" name="odd_${idx}" ${item.oddIdx === i ? 'checked' : ''} onchange="state.editorData.items[${idx}].oddIdx = ${i}; document.getElementById('editor-items-list').innerHTML = renderEditorItems()" class="absolute left-2.5 top-1/2 -translate-y-1/2 text-amber-600">
                                    <input type="text" value="${(a||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].items[${i}] = this.value" placeholder="Сөз ${i+1}" class="w-full pl-7 pr-2 py-2 bg-white border ${item.oddIdx === i ? 'border-amber-500 bg-amber-50 text-amber-900 font-bold' : 'border-slate-300 text-slate-800'} rounded-lg outline-none text-xs">

                                <input type="text" value="${(item.target||item.correct||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].target = this.value; state.editorData.items[${idx}].correct = this.value;" placeholder="Дұрыс жауап" class="w-full p-2 bg-white border border-emerald-300 rounded-xl outline-none text-emerald-700 font-bold text-xs focus:border-emerald-600 shadow-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-rose-700 uppercase mb-1">Қате нұсқалар (үтірмен)</label>
                                <input type="text" value="${(item.distractors ? item.distractors.join(', ') : (item.wrong||[]).join(', ')).replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].distractors = this.value.split(',').map(s=>s.trim()); state.editorData.items[${idx}].wrong = this.value.split(',').map(s=>s.trim());" placeholder="Қате1, Қате2, Қате3" class="w-full p-2 bg-white border border-rose-300 rounded-xl outline-none text-slate-800 text-xs focus:border-rose-600 shadow-sm">
                            </div>
                        </div>
                    `;
                } else if (temp === 'spacerace') {
                    innerContent = `
                        <input type="text" value="${(item.q||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].q = this.value" placeholder="Ғарыштық сұрақ..." class="w-full p-2.5 mb-2 bg-white border border-slate-300 rounded-xl outline-none font-bold text-slate-900 text-xs focus:border-blue-600 shadow-sm">
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" value="${(item.correct||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].correct = this.value" placeholder="Дұрыс қақпа" class="p-2 bg-white border border-emerald-300 text-emerald-700 rounded-lg text-xs font-bold">
                            <input type="text" value="${(item.wrong1||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].wrong1 = this.value" placeholder="Қате қақпа 1" class="p-2 bg-white border border-slate-300 text-slate-800 rounded-lg text-xs">
                            <input type="text" value="${(item.wrong2||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].wrong2 = this.value" placeholder="Қате қақпа 2" class="p-2 bg-white border border-slate-300 text-slate-800 rounded-lg text-xs">
                        </div>
                    `;
                } else if (temp === 'cloze') {
                    innerContent = `
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Мәтін (жасырылатын сөздерді [жақшаға] алыңыз)</label>
                        <textarea onchange="state.editorData.items[${idx}].text = this.value" class="w-full p-2.5 h-20 bg-white border border-slate-300 rounded-xl text-slate-800 text-xs outline-none resize-none mb-2 focus:border-blue-600 shadow-sm">${item.text||''}</textarea>
                        <input type="text" value="${(item.options||[]).join(', ').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].options = this.value.split(',').map(s=>s.trim())" placeholder="Қосымша алдамшы нұсқалар (үтірмен)..." class="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs text-slate-800">
                    `;
                } else if (temp === 'anagram') {
                    innerContent = `

                            <div>
                                <label class="block text-[10px] font-bold text-indigo-700 uppercase mb-1">Жасырын сөз</label>
                                <input type="text" value="${item.word||''}" onchange="state.editorData.items[${idx}].word = this.value.toUpperCase().replace(/[^А-ЯЁA-ZӘІҢҒҮҰҚӨҺ]/gi, '')" class="w-full p-2.5 text-center font-black tracking-[0.2em] uppercase bg-white border border-indigo-300 rounded-xl text-indigo-700 text-sm outline-none focus:border-indigo-600 shadow-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Көмекші анықтама</label>
                                <input type="text" value="${(item.clue||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].clue = this.value" placeholder="Сөздің сипаттамасы..." class="w-full p-2.5 bg-white border border-slate-300 rounded-xl text-slate-800 text-xs outline-none focus:border-blue-600 shadow-sm">
                            </div>
                        </div>
                    `;
                } else if (temp === 'equation') {
                    innerContent = `
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-2">
                            <input type="text" value="${(item.formula||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].formula = this.value" placeholder="Формула (Мысалы: F = m·a)" class="p-2 bg-white border border-slate-300 rounded-xl text-slate-900 font-bold text-xs">
                            <input type="text" value="${(item.q||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].q = this.value" placeholder="Есеп шарты..." class="p-2 bg-white border border-slate-300 rounded-xl text-slate-800 text-xs sm:col-span-2">

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <input type="text" value="${(item.correct||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].correct = this.value" placeholder="Дұрыс жауап" class="p-2 bg-white border border-emerald-300 text-emerald-700 font-bold rounded-lg text-xs">

                                <input type="text" value="${(op||'').replace(/"/g, '&quot;')}" onchange="state.editorData.items[${idx}].options[${i+1}] = this.value" placeholder="Қате ${i+1}" class="p-2 bg-white border border-slate-300 text-slate-800 rounded-lg text-xs">
                            `).join('')}

                    `;

                    innerContent = `

                }

                return `

                        ${innerContent}
                    </div>
                `;
            }).join('');

        function editorAddItem() {
            const temp = state.activeTemplate;
            if (temp === 'quiz' || temp === 'blitz') state.editorData.items.push({ q: 'Жаңа сұрақ', ans: ['Нұсқа 1', 'Нұсқа 2', 'Нұсқа 3', 'Нұсқа 4'], correct: 0 });
            else if (temp === 'truefalse') state.editorData.items.push({ statement: 'Жаңа тұжырым', isTrue: true });
            else if (temp === 'match') state.editorData.items.push({ term: 'Жаңа термин', def: 'Анықтамасы' });
            else if (temp === 'flashcards') state.editorData.items.push({ front: 'Сұрақ', back: 'Жауабы' });
            else if (temp === 'odd') state.editorData.items.push({ cat: 'Жаңа санат', items: ['Сөз 1', 'Сөз 2', 'Сөз 3', 'Артық сөз'], oddIdx: 3 });
            else if (temp === 'balloon' || temp === 'falling') state.editorData.items.push({ q: 'Жаңа тапсырма', target: 'Дұрыс', distractors: ['Қате 1', 'Қате 2', 'Қате 3'] });
            else if (temp === 'spacerace') state.editorData.items.push({ q: 'Сұрақ', correct: 'Дұрыс', wrong1: 'Қате 1', wrong2: 'Қате 2' });
            else if (temp === 'anagram') state.editorData.items.push({ word: 'СӨЗ', clue: 'Анықтамасы' });
            else if (temp === 'sentence') state.editorData.items.push({ phrase: 'Жаңа сөйлем құрастыру' });
            else if (temp === 'equation') state.editorData.items.push({ formula: 'E = m·c²', q: 'Масса мен энергия заңы', correct: 'E = mc²', options: ['E = mc²', 'E = mgh', 'F = ma'] });
            else state.editorData.items.push({ text: 'Жаңа элемент' });
            
            document.getElementById('editor-items-list').innerHTML = renderEditorItems();
        }

        function editorRemoveItem(idx) {
            if (state.editorData.items.length <= 1) return alert('Кем дегенде 1 элемент болуы керек');
            state.editorData.items.splice(idx, 1);
            document.getElementById('editor-items-list').innerHTML = renderEditorItems();
        }

                            <i class="fa-solid fa-arrow-left"></i> Редактор
                        </button>
                        
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-black tracking-wider text-slate-900 uppercase">${state.editorData.title}</span>
                            <span id="game-hud-combo" class="hidden text-[11px] font-black bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-0.5 rounded-full shadow-sm">x1 COMBO</span>
                        </div>
                        
                        <div class="flex items-center gap-3">
                            <div class="text-xs font-mono font-black text-emerald-800 border border-emerald-300 rounded-lg px-3 py-1.5 bg-emerald-50 shadow-sm">
                                ҰПАЙ: <span id="game-hud-score">0</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Game Dynamic Canvas -->
                    <div id="game-canvas" class="flex-1 relative flex items-center justify-center overflow-hidden p-6 sm:p-10 bg-slate-50/40"></div>
                </div>
            `;
        }

        // --- 7. GAME ENGINES DISPATCHER ---
        function initGameEngine() {
            state.gameData.step = 0;
            state.gameData.score = 0;
            state.gameData.combo = 1;
            state.gameData.streak = 0;
            
            const canvas = document.getElementById('game-canvas');
            if (state.editorData.settings.shuffle) {
                state.gameData.runItems = [...state.editorData.items].sort(() => Math.random() - 0.5);
            } else {
                state.gameData.runItems = [...state.editorData.items];
            }

            const temp = state.activeTemplate;
            if (temp === 'quiz') runEngineQuiz(canvas);
            else if (temp === 'truefalse') runEngineTrueFalse(canvas);
            else if (temp === 'match') { setTimeout(() => initEngineMatch(), 50); }
            else if (temp === 'flashcards') runEngineFlashcards(canvas);
            else if (temp === 'odd') runEngineOdd(canvas);
            else if (temp === 'balloon') runEngineBalloon(canvas);
            else if (temp === 'spacerace') runEngineSpaceRace(canvas);
            else if (temp === 'blitz') runEngineBlitz(canvas);
            else if (temp === 'falling') runEngineFalling(canvas);
            else if (temp === 'wheel') runEngineWheel(canvas);
            else if (temp === 'box') runEngineBox(canvas);
            else if (temp === 'buckets') runEngineBuckets(canvas);
            else if (temp === 'ladder') runEngineLadder(canvas);
            else if (temp === 'minefield') runEngineMinefield(canvas);
            else if (temp === 'timeline') runEngineTimeline(canvas);
            else if (temp === 'memory') { setTimeout(() => initEngineMemory(), 50); }
            else if (temp === 'wordsearch') runEngineWordSearch(canvas);
            else if (temp === 'cloze') runEngineCloze(canvas);
            else if (temp === 'anagram') runEngineAnagram(canvas);
            else if (temp === 'sentence') runEngineSentence(canvas);
            else if (temp === 'reaction') runEngineReaction(canvas);
            else if (temp === 'scale') runEngineScale(canvas);
            else if (temp === 'equation') runEngineEquation(canvas);
            else canvas.innerHTML = '<h2 class="text-slate-900 text-xl font-bold">Ойын сәтті жүктелді!</h2>';
        }

        function updateHudScore() {
            const el = document.getElementById('game-hud-score');
            if (el) el.innerText = state.gameData.score;
            const comboEl = document.getElementById('game-hud-combo');
            if (comboEl) {
                if (state.gameData.combo > 1) {
                    comboEl.classList.remove('hidden');
                    comboEl.innerText = `x${state.gameData.combo} COMBO`;
                } else {
                    comboEl.classList.add('hidden');
                }
            }
        }

        // --- WIN / SUMMARY SCREEN ---
        function renderWinScreen(canvas, total, isPerfect) {
            playSfx('win');
            canvas.innerHTML = `
                <div class="text-center p-8 sm:p-10 bg-white border ${isPerfect?'border-emerald-300 shadow-xl':'border-slate-200 shadow-lg'} rounded-3xl max-w-md w-full animate-[pop_0.4s_cubic-bezier(0.34,1.56,0.64,1)]">
                    <div class="text-6xl mb-3 animate-bounce">${isPerfect ? '🏆' : '🎉'}</div>
                    <h1 class="text-2xl font-black text-slate-900 mb-1.5">${isPerfect ? 'Керемет нәтиже!' : 'Ойын аяқталды!'}</h1>
                    <p class="text-slate-500 text-xs mb-6">Барлық тапсырмалар толық орындалды.</p>
                    
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-6 shadow-inner">
                        <p class="text-slate-500 text-[10px] font-black uppercase tracking-wider mb-1">Жинаған ұпайыңыз</p>
                        <p class="text-4xl font-black ${isPerfect ? 'text-emerald-600' : 'text-blue-700'}">${state.gameData.score} <span class="text-base text-slate-400 font-bold">/ ${total}</span></p>
                    </div>
                    
                    <div class="flex gap-2.5">
                        <button onclick="playSfx('click'); initGameEngine()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs transition shadow-sm uppercase tracking-wider">
                            <i class="fa-solid fa-rotate-right mr-1.5"></i> Қайталау
                        </button>
                        <button onclick="playSfx('click'); navigate('templates')" class="py-3 px-5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs transition border border-slate-200">
                            Мәзір
                        </button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        //  ENGINE 1: QUIZ / ВИКТОРИНА
        // ==========================================
        function runEngineQuiz(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const qItem = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-3xl flex flex-col h-full animate-[fadeIn_0.3s_ease-out]">
                    <div class="flex justify-between items-center mb-5">
                        <span class="text-slate-600 font-bold uppercase tracking-wider text-xs bg-white border border-slate-200 px-3 py-1 rounded-lg shadow-sm">Сұрақ ${state.gameData.step + 1} / ${items.length}</span>
                        <div class="w-32 bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full transition-all duration-300" style="width: ${((state.gameData.step)/items.length)*100}%"></div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-2xl shadow-sm min-h-[140px] flex items-center justify-center p-6 mb-5 border border-slate-200 text-center">
                        <h2 class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">${qItem.q}</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${qItem.ans.map((a, i) => `
                            <button onclick="quizEngineSubmit(${i}, ${qItem.correct})" id="qbtn-${i}" class="qbtn bg-white hover:bg-blue-50 text-slate-800 hover:text-blue-900 border-2 border-slate-200 hover:border-blue-400 font-bold text-sm sm:text-base p-4 rounded-xl transition-all active:scale-98 flex items-center justify-center text-center shadow-sm">
                                <span>${a}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function quizEngineSubmit(userAns, trueAns) {
            const btns = document.querySelectorAll('.qbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('pointer-events-none'); });
            
            const isCorrect = userAns === trueAns;
            if (isCorrect) {
                playSfx('correct');
                state.gameData.score += 1 * state.gameData.combo;
                state.gameData.streak++;
                if (state.gameData.streak % 2 === 0) state.gameData.combo++;
            } else {
                playSfx('wrong');
                state.gameData.combo = 1;
                state.gameData.streak = 0;
            }
            updateHudScore();
            
            const cb = document.getElementById('qbtn-' + trueAns);
            if (cb) {
                cb.classList.add('!bg-emerald-600', '!text-white', '!border-emerald-600', 'shadow-md');
                cb.classList.remove('bg-white', 'hover:bg-blue-50');
            }
            
            if (!isCorrect) {
                const ub = document.getElementById('qbtn-' + userAns);
                if (ub) {
                    ub.classList.add('!bg-rose-600', '!text-white', '!border-rose-600');
                    ub.classList.remove('bg-white', 'hover:bg-blue-50');
                }
            }
            
            setTimeout(() => {
                state.gameData.step++;
                runEngineQuiz(document.getElementById('game-canvas'));
            }, 1100);
        }

        // ==========================================
        //  ENGINE 2: TRUE / FALSE
        // ==========================================
        function runEngineTrueFalse(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const item = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-xl flex flex-col h-full items-center justify-center animate-[pop_0.35s_ease-out]">
                    <div class="bg-white border-2 border-slate-200 rounded-2xl p-8 w-full text-center shadow-sm relative mb-8">
                        <span class="bg-blue-50 text-blue-700 font-extrabold tracking-wider px-3.5 py-1 rounded-full uppercase text-xs border border-blue-200">
                            Факт ${state.gameData.step + 1} / ${items.length}
                        </span>
                        <h2 class="text-xl sm:text-2xl font-black text-slate-900 leading-snug mt-5">${item.statement}</h2>
                    </div>
                    
                    <div class="flex gap-4 w-full justify-center">
                        <button onclick="tfEngineSubmit(true, ${item.isTrue})" class="tfbtn flex-1 max-w-[170px] h-16 bg-emerald-50 border-2 border-emerald-500 hover:bg-emerald-600 hover:text-white text-emerald-800 font-black text-base uppercase rounded-xl transition shadow-sm active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check"></i> ШЫНДЫҚ
                        </button>
                        <button onclick="tfEngineSubmit(false, ${item.isTrue})" class="tfbtn flex-1 max-w-[170px] h-16 bg-rose-50 border-2 border-rose-500 hover:bg-rose-600 hover:text-white text-rose-800 font-black text-base uppercase rounded-xl transition shadow-sm active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-xmark"></i> ЖАЛҒАН
                        </button>
                    </div>
                </div>
            `;
        }

        function tfEngineSubmit(userSelection, correctBool) {
            const btns = document.querySelectorAll('.tfbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('pointer-events-none'); });
            
            const isCorrect = userSelection === correctBool;
            if (isCorrect) {
                playSfx('correct');
                state.gameData.score++;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            
            setTimeout(() => {
                state.gameData.step++;
                runEngineTrueFalse(document.getElementById('game-canvas'));
            }, 800);
        }

        // ==========================================
        //  ENGINE 3: MATCH / ЖҰБЫН ТАП
        // ==========================================
        let matchState = { selectedTerm: null, selectedDef: null, matchedCount: 0, total: 0 };
        function initEngineMatch() {
            const canvas = document.getElementById('game-canvas');
            const items = state.gameData.runItems;
            
            let terms = items.map((x, i) => ({ id: i, text: x.term })).sort(() => Math.random() - 0.5);
            let defs = items.map((x, i) => ({ id: i, text: x.def })).sort(() => Math.random() - 0.5);
            
            matchState = { selectedTerm: null, selectedDef: null, matchedCount: 0, total: items.length };
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col md:flex-row gap-5 items-center justify-center animate-[fadeIn_0.3s_ease-out] relative">
                    <div class="flex-1 w-full max-w-sm flex flex-col gap-2.5">
                        <span class="text-xs font-black uppercase text-blue-700 tracking-wider">Терминдер</span>
                        ${terms.map(t => `
                            <button onclick="selectMatchCard('term', ${t.id}, this)" id="term-${t.id}" class="match-card bg-white border-l-4 border-blue-600 border border-slate-200 rounded-xl p-3.5 text-left text-slate-900 font-bold text-xs sm:text-sm hover:bg-blue-50/50 transition shadow-sm">
                                ${t.text}
                            </button>
                        `).join('')}
                    </div>
                    <div class="flex-1 w-full max-w-sm flex flex-col gap-2.5">
                        <span class="text-xs font-black uppercase text-indigo-700 tracking-wider">Анықтамалар</span>
                        ${defs.map(d => `
                            <button onclick="selectMatchCard('def', ${d.id}, this)" id="def-${d.id}" class="match-card bg-white border-r-4 border-indigo-600 border border-slate-200 rounded-xl p-3.5 text-right text-slate-700 font-medium text-xs hover:bg-indigo-50/50 transition shadow-sm">
                                ${d.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectMatchCard(type, id, el) {
            playSfx('click');
            const siblings = el.parentElement.querySelectorAll('.match-card');
            siblings.forEach(s => {
                if (!s.classList.contains('matched-card')) {
                    s.classList.remove('!bg-blue-600', '!bg-indigo-600', '!text-white', 'scale-102');
                    s.classList.add('bg-white');
                }
            });
            
            if (type === 'term') {
                matchState.selectedTerm = { id, el };
                el.classList.add('!bg-blue-600', '!text-white', 'scale-102');
            } else {
                matchState.selectedDef = { id, el };
                el.classList.add('!bg-indigo-600', '!text-white', 'scale-102');
            }
            
            if (matchState.selectedTerm && matchState.selectedDef) {
                const isMatch = matchState.selectedTerm.id === matchState.selectedDef.id;
                const tEl = matchState.selectedTerm.el;
                const dEl = matchState.selectedDef.el;
                
                if (isMatch) {
                    playSfx('correct');
                    tEl.className = 'match-card matched-card border-l-4 border-emerald-500 bg-emerald-50 rounded-xl p-3.5 text-emerald-800 font-bold text-xs pointer-events-none border border-emerald-200';
                    dEl.className = 'match-card matched-card border-r-4 border-emerald-500 bg-emerald-50 rounded-xl p-3.5 text-emerald-800 text-xs pointer-events-none border border-emerald-200';
                    tEl.innerHTML = '<i class="fa-solid fa-check mr-2"></i>' + tEl.innerText;
                    
                    matchState.matchedCount++;
                    state.gameData.score++;
                    updateHudScore();
                    
                    matchState.selectedTerm = null;
                    matchState.selectedDef = null;
                    
                    if (matchState.matchedCount === matchState.total) {
                        setTimeout(() => renderWinScreen(document.getElementById('game-canvas'), matchState.total, true), 800);
                    }
                } else {
                    playSfx('wrong');
                    tEl.classList.add('!bg-rose-500', '!text-white');
                    dEl.classList.add('!bg-rose-500', '!text-white');
                    setTimeout(() => {
                        tEl.classList.remove('!bg-rose-500', '!bg-blue-600', '!text-white', 'scale-102');
                        dEl.classList.remove('!bg-rose-500', '!bg-indigo-600', '!text-white', 'scale-102');
                        tEl.classList.add('bg-white');
                        dEl.classList.add('bg-white');
                    }, 400);
                    matchState.selectedTerm = null;
                    matchState.selectedDef = null;
                }
            }
        }

        // ==========================================
        //  ENGINE 4: FLASHCARDS 3D
        // ==========================================
        let flashcardFlipped = false;
        function runEngineFlashcards(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, true);
            
            const card = items[state.gameData.step];
            flashcardFlipped = false;
            
            canvas.innerHTML = `
                <div class="w-full max-w-lg flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                    <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">
                        Карта ${state.gameData.step + 1} / ${items.length} (Басып аударыңыз)
                    </div>
                    
                    <div onclick="toggleFlashcard()" id="fcard-inner" class="w-full h-64 cursor-pointer perspective-1000 relative rounded-2xl group">
                        <div class="w-full h-full duration-500 transform-style-3d relative rounded-2xl shadow-lg transition-transform" id="fcard-box">
                            <!-- Front -->
                            <div class="absolute inset-0 backface-hidden bg-white border-2 border-blue-200 rounded-2xl p-6 flex flex-col items-center justify-center text-center shadow-md">
                                <span class="text-[10px] font-black uppercase tracking-wider text-blue-700 mb-2">СҰРАҚ / ТЕРМИН</span>
                                <h2 class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">${card.front}</h2>
                                <span class="absolute bottom-3 text-xs text-slate-400 font-bold"><i class="fa-solid fa-rotate mr-1"></i> Жауапты көру үшін басыңыз</span>
                            </div>
                            <!-- Back -->
                            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-50 to-blue-50 border-2 border-indigo-300 rounded-2xl p-6 flex flex-col items-center justify-center text-center shadow-md">
                                <span class="text-[10px] font-black uppercase tracking-wider text-indigo-700 mb-2">ЖАУАП / ТҮСІНДІРМЕ</span>
                                <p class="text-base sm:text-lg font-bold text-slate-800 leading-relaxed">${card.back}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex gap-3 w-full mt-6">
                        <button onclick="playSfx('click'); state.gameData.step++; runEngineFlashcards(document.getElementById('game-canvas'))" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl border border-slate-200 transition">
                            Қайталау
                        </button>
                        <button onclick="playSfx('correct'); state.gameData.score++; updateHudScore(); state.gameData.step++; runEngineFlashcards(document.getElementById('game-canvas'))" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-sm transition">
                            Білдім! (+1)
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleFlashcard() {
            playSfx('click');
            const box = document.getElementById('fcard-box');
            flashcardFlipped = !flashcardFlipped;
            if (flashcardFlipped) box.classList.add('rotate-y-180');
            else box.classList.remove('rotate-y-180');
        }

        // ==========================================
        //  ENGINE 5: ODD ONE OUT / АРТЫҚ СӨЗ
        // ==========================================
        function runEngineOdd(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const item = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-3xl flex flex-col h-full items-center justify-center animate-[pop_0.3s_ease-out]">
                    ${item.cat ? `<div class="bg-amber-50 border border-amber-200 px-4 py-1 mb-5 rounded-full text-xs font-black uppercase text-amber-800">Санат: ${item.cat}</div>` : ''}
                    <h2 class="text-xl sm:text-2xl font-black text-slate-900 text-center mb-6">Артық сөзді табыңыз</h2>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
                        ${item.items.map((opt, i) => `
                            <button onclick="oddEngineSubmit(${i}, ${item.oddIdx})" id="oddbtn-${i}" class="oddbtn h-24 bg-white border-2 border-slate-200 rounded-xl shadow-sm flex items-center justify-center text-sm sm:text-base font-bold text-slate-800 hover:text-amber-900 hover:bg-amber-50 hover:border-amber-400 transition-all active:scale-95 p-3 text-center">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function oddEngineSubmit(userAns, trueAns) {
            const btns = document.querySelectorAll('.oddbtn');
            btns.forEach(b => { b.onclick = null; b.classList.add('pointer-events-none'); });
            
            const isCorrect = userAns === trueAns;
            if (isCorrect) {
                playSfx('correct');
                state.gameData.score++;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            
            const cb = document.getElementById('oddbtn-' + trueAns);
            if (cb) cb.classList.add('!bg-amber-500', '!text-white', '!border-amber-500');
            
            setTimeout(() => {
                state.gameData.step++;
                runEngineOdd(document.getElementById('game-canvas'));
            }, 1000);
        }

        // ==========================================
        //  ENGINE 6: BALLOON POP (TARGET STRIKE)
        // ==========================================
        function runEngineBalloon(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const cur = items[state.gameData.step];
            const targetWord = cur.target || cur.correct;
            const allOptions = [targetWord, ...(cur.distractors || cur.wrong || [])].sort(() => Math.random() - 0.5);
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col items-center relative overflow-hidden select-none">
                    <div class="bg-white border border-slate-200 px-5 py-2.5 rounded-xl mb-6 text-center shadow-sm z-10">
                        <span class="text-[10px] font-black uppercase tracking-wider text-rose-700 block mb-0.5">Тапсырма</span>
                        <h2 class="text-lg sm:text-xl font-black text-slate-900">${cur.q}</h2>
                    </div>
                    
                    <div id="balloon-arena" class="w-full flex-1 relative flex flex-wrap items-center justify-center gap-5 p-4">
                        ${allOptions.map((opt, i) => {
                            const colors = [
                                'from-rose-500 to-red-600',
                                'from-blue-500 to-indigo-600',
                                'from-emerald-500 to-teal-600',
                                'from-amber-500 to-orange-600',
                                'from-purple-500 to-indigo-600'
                            ];
                            const c = colors[i % colors.length];
                            return `
                                <div onclick="popBalloon(this, '${opt.replace(/'/g, "\\'")}', '${targetWord.replace(/'/g, "\\'")}')" class="balloon-target w-26 h-34 sm:w-32 sm:h-40 bg-gradient-to-b ${c} rounded-[50%] flex items-center justify-center p-3 text-center text-white font-bold text-xs sm:text-sm shadow-md relative cursor-pointer active:scale-90 animate-[floatSlow_3s_ease-in-out_infinite]" style="animation-delay: ${i * 0.4}s">
                                    <span class="drop-shadow-sm pointer-events-none">${opt}</span>
                                    <div class="absolute -bottom-2 w-0 h-0 border-l-[5px] border-l-transparent border-r-[5px] border-r-transparent border-b-[8px] border-b-white/60"></div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function popBalloon(el, selected, correct) {
            if (selected === correct) {
                playSfx('pop');
                el.style.transform = 'scale(1.3)';
                el.style.opacity = '0';
                el.style.transition = 'all 0.2s ease-out';
                state.gameData.score++;
                updateHudScore();
                
                setTimeout(() => {
                    state.gameData.step++;
                    runEngineBalloon(document.getElementById('game-canvas'));
                }, 600);
            } else {
                playSfx('wrong');
                el.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 300 });
            }
        }

        // ==========================================
        //  ENGINE 7: SPACE RACE (ҒАРЫШ ЖАРЫСЫ)
        // ==========================================
        function runEngineSpaceRace(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const cur = items[state.gameData.step];
            const lanes = [cur.correct, cur.wrong1, cur.wrong2].sort(() => Math.random() - 0.5);
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col items-center relative overflow-hidden select-none">
                    <div class="bg-white border border-slate-200 px-5 py-2.5 rounded-xl mb-6 text-center shadow-sm z-10">
                        <span class="text-[10px] font-black uppercase tracking-wider text-indigo-700 block mb-0.5">Ғарыштық навигатор</span>
                        <h2 class="text-lg sm:text-xl font-black text-slate-900">${cur.q}</h2>
                    </div>
                    
                    <div class="w-full max-w-2xl grid grid-cols-3 gap-3.5 flex-1 items-center">
                        ${lanes.map((opt, i) => `
                            <div onclick="chooseSpaceGate('${opt.replace(/'/g, "\\'")}', '${cur.correct.replace(/'/g, "\\'")}')" class="h-44 rounded-2xl bg-white border-2 border-indigo-100 hover:border-blue-600 hover:bg-blue-50/50 hover:scale-102 transition-all flex flex-col items-center justify-between p-4 cursor-pointer text-center group shadow-sm">
                                <span class="text-xs font-extrabold text-slate-400 group-hover:text-blue-700">ҚАҚПА ${i+1}</span>
                                <span class="text-sm sm:text-base font-black text-slate-900">${opt}</span>
                                <div class="w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition">
                                    <i class="fa-solid fa-rocket text-xs"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function chooseSpaceGate(selected, correct) {
            if (selected === correct) {
                playSfx('boost');
                state.gameData.score++;
                updateHudScore();
                setTimeout(() => {
                    state.gameData.step++;
                    runEngineSpaceRace(document.getElementById('game-canvas'));
                }, 700);
            } else {
                playSfx('wrong');
                setTimeout(() => {
                    state.gameData.step++;
                    runEngineSpaceRace(document.getElementById('game-canvas'));
                }, 900);
            }
        }

        // ==========================================
        //  ENGINE 8: SPEED BLITZ x3
        // ==========================================
        let blitzTimer = null;
        let blitzTimeLeft = 20;
        function runEngineBlitz(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length || blitzTimeLeft <= 0) {
                if (blitzTimer) clearInterval(blitzTimer);
                return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            }
            
            const cur = items[state.gameData.step];
            if (!blitzTimer) {
                blitzTimeLeft = 20;
                blitzTimer = setInterval(() => {
                    blitzTimeLeft--;
                    const tEl = document.getElementById('blitz-time-hud');
                    if (tEl) tEl.innerText = blitzTimeLeft + 'с';
                    if (blitzTimeLeft <= 0) {
                        clearInterval(blitzTimer);
                        blitzTimer = null;
                        renderWinScreen(document.getElementById('game-canvas'), items.length, false);
                    }
                }, 1000);
            }
            
            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col h-full animate-[fadeIn_0.2s_ease-out]">
                    <div class="flex justify-between items-center mb-5">
                        <span class="text-xs font-black uppercase text-amber-800 tracking-wider">БЛИЦ-РАУНД ${state.gameData.step + 1} / ${items.length}</span>
                        <div class="text-sm font-mono font-black text-amber-900 bg-amber-50 border border-amber-300 px-3 py-1 rounded-full" id="blitz-time-hud">
                            ${blitzTimeLeft}с
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-2xl p-6 mb-5 border-2 border-amber-200 text-center shadow-sm">
                        <h2 class="text-2xl font-black text-slate-900">${cur.q}</h2>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        ${cur.ans.map((a, i) => `
                            <button onclick="blitzSubmit(${i}, ${cur.correct})" class="bg-white hover:bg-amber-500 hover:text-white text-slate-800 font-bold text-base p-4 rounded-xl border border-slate-200 transition shadow-sm">
                                ${a}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function blitzSubmit(ans, correct) {
            if (ans === correct) {
                playSfx('correct');
                state.gameData.score++;
                blitzTimeLeft += 2;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            state.gameData.step++;
            runEngineBlitz(document.getElementById('game-canvas'));
        }

        // ==========================================
        //  ENGINE 9: FALLING ANSWERS / METEOR DEFENSE
        // ==========================================
        function runEngineFalling(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const cur = items[state.gameData.step];
            const all = [cur.correct || cur.target, ...(cur.wrong || cur.distractors || [])].sort(() => Math.random() - 0.5);
            
            canvas.innerHTML = `
                <div class="w-full h-full flex flex-col items-center relative overflow-hidden">
                    <div class="bg-white border border-slate-200 px-5 py-2.5 rounded-xl mb-6 text-center shadow-sm">
                        <span class="text-[10px] font-black uppercase tracking-wider text-sky-700 block mb-0.5">Метеорит қорғанысы</span>
                        <h2 class="text-lg sm:text-xl font-black text-slate-900">${cur.q}</h2>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5 w-full max-w-3xl flex-1 items-center">
                        ${all.map((opt, i) => `
                            <button onclick="fallingCatch('${opt.replace(/'/g, "\\'")}', '${(cur.correct||cur.target).replace(/'/g, "\\'")}')" class="h-28 bg-white border-2 border-sky-200 hover:border-sky-500 hover:bg-sky-50 rounded-2xl text-slate-900 font-bold text-sm p-3 transition-all shadow-sm flex flex-col items-center justify-center gap-1.5">
                                <i class="fa-solid fa-meteor text-sky-600 text-lg"></i>
                                <span>${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function fallingCatch(sel, target) {
            if (sel === target) {
                playSfx('correct');
                state.gameData.score++;
                updateHudScore();
                setTimeout(() => {
                    state.gameData.step++;
                    runEngineFalling(document.getElementById('game-canvas'));
                }, 600);
            } else {
                playSfx('wrong');
            }
        }

        // ==========================================
        //  ENGINE 10: WHEEL OF FORTUNE / РУЛЕТКА
        // ==========================================
        function runEngineWheel(canvas) {
            const items = state.gameData.runItems;
            canvas.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center animate-[pop_0.4s_ease-out]">
                    <h2 class="text-xl font-black text-slate-900 mb-6 tracking-wider uppercase">Сәттілік дөңгелегі</h2>
                    <div class="relative w-64 h-64 sm:w-72 sm:h-72 rounded-full border-[6px] border-slate-300 bg-white shadow-lg overflow-hidden" id="spin-wheel">
                        ${items.map((item, i) => `
                            <div class="absolute w-[50%] h-[1px] bg-slate-200 top-1/2 left-1/2 origin-left" style="transform: rotate(${i*(360/items.length)}deg);"></div>
                            <div class="absolute text-center text-[10px] font-black text-slate-800 uppercase left-1/2 top-[47%] origin-left" style="transform: rotate(${i*(360/items.length) + (180/items.length)}deg); width: 46%; padding-left: 6px;">${item.text}</div>
                        `).join('')}
                    </div>
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[18px] border-t-rose-600 absolute top-1/2 -mt-[145px] z-10 drop-shadow"></div>
                    <button onclick="spinRouletteWheel()" class="mt-6 bg-rose-600 hover:bg-rose-700 text-white px-7 py-3 rounded-xl font-bold text-sm tracking-wider shadow-sm transition-all active:scale-95">
                        АЙНАЛДЫРУ
                    </button>
                </div>
            `;
        }

        function spinRouletteWheel() {
            playSfx('boost');
            const deg = Math.floor(Math.random() * 3600) + 1440;
            const w = document.getElementById('spin-wheel');
            w.style.transition = 'transform 4s cubic-bezier(0.12, 0.8, 0.15, 1)';
            w.style.transform = `rotate(${deg}deg)`;
            setTimeout(() => {
                playSfx('win');
                state.gameData.score += 50;
                updateHudScore();
            }, 4100);
        }

        // ==========================================
        //  ENGINE 11: MYSTERY BOX / ҚОРАПТАР
        // ==========================================
        function runEngineBox(canvas) {
            const items = state.gameData.runItems;
            canvas.innerHTML = `
                <div class="w-full flex flex-col items-center justify-center animate-[pop_0.3s_ease-out]">
                    <h2 class="text-xl font-black text-center text-slate-900 mb-6 tracking-wider uppercase">Құпия қорапты ашыңыз</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 max-w-2xl w-full">
                        ${items.map((item, i) => `
                            <button onclick="openMysteryBox(this, '${item.text.replace(/'/g, "\\'")}')" class="aspect-square bg-white border-2 border-slate-200 hover:border-teal-500 rounded-2xl flex flex-col items-center justify-center text-4xl shadow-sm transition-all cursor-pointer group hover:scale-102">
                                <span class="group-hover:animate-bounce">🎁</span>
                                <span class="text-[10px] font-bold text-slate-500 mt-2">Қорап ${i+1}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openMysteryBox(el, text) {
            playSfx('pop');
            el.innerHTML = `<span class="text-xs sm:text-sm font-bold text-teal-900 bg-teal-50 p-3 rounded-xl border border-teal-200 shadow-sm leading-tight">${text}</span>`;
            el.classList.add('scale-102', '!border-teal-500');
            el.onclick = null;
            state.gameData.score += 20;
            updateHudScore();
        }

        // ==========================================
        //  ENGINE 12: CATEGORY BUCKETS / САНАТТАР СЕБЕТІ
        // ==========================================
        let bucketState = { elements: [], curIdx: 0, bA: '', bB: '' };
        function runEngineBuckets(canvas) {
            const items = state.gameData.runItems;
            const data = items[0] || { bucketA: 'Санат A', bucketB: 'Санат B', elements: [] };
            bucketState = { elements: [...data.elements], curIdx: 0, bA: data.bucketA, bB: data.bucketB };
            renderBucketStep(canvas);
        }

        function renderBucketStep(canvas) {
            if (bucketState.curIdx >= bucketState.elements.length) {
                return renderWinScreen(canvas, bucketState.elements.length, state.gameData.score >= bucketState.elements.length);
            }
            
            const curEl = bucketState.elements[bucketState.curIdx];
            
            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col items-center justify-center animate-[fadeIn_0.3s_ease-out]">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Элемент ${bucketState.curIdx + 1} / ${bucketState.elements.length}</span>
                    
                    <!-- Item Card -->
                    <div class="bg-white border-2 border-blue-400 rounded-2xl p-6 mb-6 text-center shadow-sm w-full">
                        <h2 class="text-2xl font-black text-slate-900">${curEl.text}</h2>
                    </div>
                    
                    <!-- 2 Buckets -->
                    <div class="grid grid-cols-2 gap-4 w-full">
                        <button onclick="placeInBucket('A', '${curEl.b}')" class="h-32 bg-white border-2 border-blue-300 hover:bg-blue-600 hover:text-white rounded-2xl text-slate-900 font-bold text-base p-4 transition shadow-sm flex flex-col items-center justify-center gap-1.5 group">
                            <i class="fa-solid fa-box text-blue-600 group-hover:text-white text-xl"></i>
                            <span>${bucketState.bA}</span>
                        </button>
                        <button onclick="placeInBucket('B', '${curEl.b}')" class="h-32 bg-white border-2 border-indigo-300 hover:bg-indigo-600 hover:text-white rounded-2xl text-slate-900 font-bold text-base p-4 transition shadow-sm flex flex-col items-center justify-center gap-1.5 group">
                            <i class="fa-solid fa-box text-indigo-600 group-hover:text-white text-xl"></i>
                            <span>${bucketState.bB}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function placeInBucket(userChoice, correctB) {
            if (userChoice === correctB) {
                playSfx('correct');
                state.gameData.score++;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            bucketState.curIdx++;
            renderBucketStep(document.getElementById('game-canvas'));
        }

        // ==========================================
        //  ENGINE 13: RANK LADDER / РАНЖИРЛЕУ
        // ==========================================
        let ladderSteps = [];
        function runEngineLadder(canvas) {
            const data = state.gameData.runItems[0] || { title: 'Реттеңіз', steps: [] };
            ladderSteps = [...data.steps].sort(() => Math.random() - 0.5);
            
            canvas.innerHTML = `
                <div class="w-full max-w-xl flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                    <h2 class="text-lg font-black text-slate-900 mb-5 text-center">${data.title}</h2>
                    
                    <div class="w-full space-y-2 mb-5" id="ladder-list">
                        ${ladderSteps.map((st, i) => `
                            <div class="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-xl text-slate-900 font-bold text-xs sm:text-sm shadow-sm">
                                <span class="w-5 h-5 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center text-xs text-slate-700 font-mono">${i+1}</span>
                                <span class="flex-1 px-3">${st}</span>
                                <div class="flex gap-1">
                                    <button onclick="moveLadderItem(${i}, -1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                                    <button onclick="moveLadderItem(${i}, 1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center"><i class="fa-solid fa-arrow-down text-xs"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <button onclick="checkLadderWin()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition uppercase tracking-wider shadow-sm">
                        Тексеру
                    </button>
                </div>
            `;
        }

        function moveLadderItem(idx, dir) {
            playSfx('click');
            const target = idx + dir;
            if (target < 0 || target >= ladderSteps.length) return;
            const temp = ladderSteps[idx];
            ladderSteps[idx] = ladderSteps[target];
            ladderSteps[target] = temp;
            runEngineLadder(document.getElementById('game-canvas'));
        }

        function checkLadderWin() {
            const original = state.gameData.runItems[0].steps;
            const isCorrect = ladderSteps.every((val, idx) => val === original[idx]);
            if (isCorrect) {
                playSfx('correct');
                state.gameData.score = 100;
                updateHudScore();
                renderWinScreen(document.getElementById('game-canvas'), 100, true);
            } else {
                playSfx('wrong');
                alert('Реті әлі дұрыс емес, қайта көріңіз!');
            }
        }

        // ==========================================
        //  ENGINE 14: MINEFIELD / ҚАУІПСІЗ ЖОЛ
        // ==========================================
        function runEngineMinefield(canvas) {
            const items = state.gameData.runItems;
            if (state.gameData.step >= items.length) return renderWinScreen(canvas, items.length, state.gameData.score >= items.length);
            
            const cur = items[state.gameData.step];
            
            canvas.innerHTML = `
                <div class="w-full max-w-lg flex flex-col items-center justify-center animate-[pop_0.3s_ease-out]">
                    <span class="text-xs font-black uppercase text-teal-700 tracking-wider mb-1.5">Мина алаңы: Қадам ${state.gameData.step + 1} / ${items.length}</span>
                    <p class="text-xs text-slate-500 mb-5 text-center">Егер тұжырым АҚИҚАТ болса — қадам жасаңыз, егер ЖАЛҒАН болса — айналып өтіңіз!</p>
                    
                    <div class="bg-white border-2 border-teal-300 rounded-2xl p-6 mb-6 text-center shadow-sm w-full">
                        <h2 class="text-xl font-black text-slate-900 leading-snug">${cur.text}</h2>
                    </div>
                    
                    <div class="flex gap-3 w-full">
                        <button onclick="minefieldStep(true, ${cur.safe})" class="flex-1 py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs rounded-xl shadow-sm transition">
                            <i class="fa-solid fa-shoe-prints mr-1.5"></i> Қадам жасау (Ақиқат)
                        </button>
                        <button onclick="minefieldStep(false, ${cur.safe})" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl border border-slate-200 transition">
                            Айналып өту (Жалған)
                        </button>
                    </div>
                </div>
            `;
        }

        function minefieldStep(userStep, isSafe) {
            const success = (userStep && isSafe) || (!userStep && !isSafe);
            if (success) {
                playSfx('correct');
                state.gameData.score++;
            } else {
                playSfx('wrong');
            }
            updateHudScore();
            state.gameData.step++;
            runEngineMinefield(document.getElementById('game-canvas'));
        }

        // ==========================================
        //  ENGINE 15: TIMELINE / УАҚЫТ ЖЕЛІСІ
        // ==========================================
        function runEngineTimeline(canvas) {
            const items = state.gameData.runItems;
            const sorted = [...items].sort((a,b) => parseInt(a.year) - parseInt(b.year));
            
            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                    <h2 class="text-xl font-black text-slate-900 mb-6 uppercase tracking-wider">Хронологиялық уақыт желісі</h2>
                    
                    <div class="relative border-l-2 border-amber-400 ml-4 space-y-4 w-full">
                        ${sorted.map((ev, i) => `
                            <div class="ml-5 relative bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div class="absolute -left-[27px] w-4 h-4 rounded-full bg-amber-500 border-2 border-white"></div>
                                <div>
                                    <span class="text-xs font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 font-mono">${ev.year} жыл</span>
                                    <h3 class="text-xs sm:text-sm font-bold text-slate-900 mt-1">${ev.title}</h3>
                                </div>
                                <i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>
                            </div>
                        `).join('')}
                    </div>
                    
                    <button onclick="playSfx('win'); state.gameData.score=50; updateHudScore(); renderWinScreen(document.getElementById('game-canvas'), 50, true)" class="mt-6 py-2.5 px-6 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-xl uppercase tracking-wider shadow-sm">
                        Аяқтау
                    </button>
                </div>
            `;
        }

        // ==========================================
        //  ENGINE 16: MEMORY / ЖАД МАТРИЦАСЫ
        // ==========================================
        let memoryState = { cards: [], flipped: [], matched: 0, total: 0 };
        function initEngineMemory() {
            const canvas = document.getElementById('game-canvas');
            const items = state.gameData.runItems;
            let cards = [];
            items.forEach((x, i) => {
                cards.push({ id: i, txt: x.pair });
                cards.push({ id: i, txt: x.pair2 });
            });
            cards.sort(() => Math.random() - 0.5);
            memoryState = { cards, flipped: [], matched: 0, total: items.length };
            
            canvas.innerHTML = `
                <div class="w-full h-full flex items-center justify-center flex-col animate-[fadeIn_0.3s_ease-out]">
                    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5 max-w-4xl mx-auto">
                        ${cards.map((c, i) => `
                            <div onclick="memoryFlip(${i})" id="mem-${i}" class="w-18 h-24 sm:w-22 sm:h-28 bg-white border-2 border-slate-200 hover:border-blue-400 rounded-xl flex items-center justify-center text-2xl shadow-sm cursor-pointer transition-all hover:scale-102 relative overflow-hidden" data-id="${c.id}" data-txt="${c.txt}">
                                <span class="opacity-0 transition-opacity absolute inset-0 flex items-center justify-center font-bold text-xs text-white bg-blue-600 p-2 text-center">${c.txt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function memoryFlip(idx) {
            playSfx('click');
            const el = document.getElementById('mem-' + idx);
            if (el.classList.contains('pointer-events-none') || memoryState.flipped.includes(idx)) return;
            
            el.children[0].classList.remove('opacity-0');
            memoryState.flipped.push(idx);
            
            if (memoryState.flipped.length === 2) {
                const [i1, i2] = memoryState.flipped;
                const e1 = document.getElementById('mem-' + i1);
                const e2 = document.getElementById('mem-' + i2);
                
                if (e1.dataset.id === e2.dataset.id) {
                    playSfx('correct');
                    memoryState.matched++;
                    state.gameData.score++;
                    updateHudScore();
                    
                    e1.children[0].className = 'absolute inset-0 flex items-center justify-center font-bold text-xs text-white bg-emerald-600 rounded-xl';
                    e2.children[0].className = 'absolute inset-0 flex items-center justify-center font-bold text-xs text-white bg-emerald-600 rounded-xl';
                    e1.classList.add('pointer-events-none');
                    e2.classList.add('pointer-events-none');
                    memoryState.flipped = [];
                    
                    if (memoryState.matched === memoryState.total) {
                        setTimeout(() => renderWinScreen(document.getElementById('game-canvas'), memoryState.total, true), 800);
                    }
                } else {
                    playSfx('wrong');
                    setTimeout(() => {
                        e1.children[0].classList.add('opacity-0');
                        e2.children[0].classList.add('opacity-0');
                        memoryState.flipped = [];
                    }, 700);
                }
            }
        }

        // ==========================================
        //  ENGINE 17: WORD SEARCH / ФИЛВОРД
        // ==========================================
        function runEngineWordSearch(canvas) {
            const data = state.gameData.runItems[0] || { words: ['АТОМ', 'КҮШ', 'МАССА'], hint: 'Терминдер' };
            
            canvas.innerHTML = `
                <div class="w-full max-w-lg flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
                    <span class="text-xs font-black uppercase text-indigo-700 tracking-wider mb-1.5">Филворд: ${data.hint}</span>
                    <p class="text-xs text-slate-500 mb-5">Төмендегі сөздерді тауып белгілеңіз:</p>
                    
                    <div class="flex flex-wrap gap-2 mb-5">
                        ${data.words.map(w => `
                            <span id="ws-word-${w}" class="px-3 py-1 bg-white border border-slate-200 rounded-lg text-slate-900 font-bold text-xs shadow-sm">${w}</span>
                        `).join('')}
                    </div>
