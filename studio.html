        const GEMINI_API_KEY = 'AIzaSyAheibdcYZ6SC46CzJ2kO-rAvSIjHEo9to';
        
        async function fetchGemini(prompt) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.7 } })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) return data.candidates[0].content.parts[0].text;
                return "Сбой в матрице... Попробуйте еще раз.";
            } catch(e) { console.error(e); return "Ошибка сети."; }
        }

        function toggleAI() { document.getElementById('ai-modal').classList.toggle('active'); document.getElementById('ai-input').focus(); }
        
        function appendAIMsg(text, sender) {
            const m = document.createElement('div');
            m.className = `msg ${sender}`;
            m.innerHTML = text;
            const container = document.getElementById('ai-msgs');
            container.appendChild(m);
            container.scrollTop = container.scrollHeight;
        }
        
        async function sendAIMsg() {
            const inp = document.getElementById('ai-input');
            const txt = inp.value.trim();
            if(!txt) return;
            appendAIMsg(txt, 'user');
            inp.value = '';
            
            const msgObj = document.createElement('div');
            msgObj.className = 'msg bot flex gap-2 items-center';
            msgObj.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-[#38bdf8]"></i> Интегрирую знания...';
            document.getElementById('ai-msgs').appendChild(msgObj);
            document.getElementById('ai-msgs').scrollTop = document.getElementById('ai-msgs').scrollHeight;
            
            const sysPrompt = "Тебя зовут Нейро-Көмекші редактора. Ты помогаешь учителям создавать игры на ActivityMaker. Отвечай кратко, дружелюбно, используй HTML-теги <b> для выделения вместо маркдауна. Сұрақ пользователя: " + txt;
            let ans = await fetchGemini(sysPrompt);
            msgObj.innerHTML = ans.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            document.getElementById('ai-msgs').scrollTop = document.getElementById('ai-msgs').scrollHeight;
        }

        async function aiOpenGenerator(event) {
            const topic = prompt('На какую тему сгенерировать контент? (например: Астрономия, Строение атома, Биология клетки)');
            if(!topic) return;
            const btnI = event.currentTarget.querySelector('i');
            btnI.classList.add('fa-spin');
            
            let jsonFormat = "";
            let itemCount = 4;
            let temp = state.activeTemplate;
            
            if(temp === 'quiz') jsonFormat = `[{"q":"Вопрос","ans":["Неверно","Неверно","Неверно","Правильный"],"correct":3}]`;
            else if(temp === 'truefalse') jsonFormat = `[{"statement":"Факт","isTrue":true/false}]`;
            else if(temp === 'match') { jsonFormat = `[{"term":"Термин","def":"Анықтама"}]`; itemCount=5; }
            else if(temp === 'odd') jsonFormat = `[{"cat":"Категория","items":["Слово1","Слово2","Слово3","СловоАртық"],"oddIdx":3}]`;
            else if(temp === 'sentence') { jsonFormat = `[{"phrase":"Предложение из 4-6 слов"}]`; itemCount=2; }
            else if(temp === 'memory') jsonFormat = `[{"pair":"Эмодзи или Иконка","pair2":"Связанное слово"}]`;
            else jsonFormat = `[{"text":"Сөз или короткий текст"}]`;
            
            const sysPrompt = `Сгенерируй крутой образовательный контент на русском языке для школьников по теме: "${topic}". Верни СТРОГО валидный JSON-массив из ${itemCount} элементов. Формат каждого элемента должен быть в точности таким: ${jsonFormat}. Если это quiz/odd, формат обязывает поле correct/oddIdx быть 3, поэтому всегда ставь правильный/лишний ответ в конец массива на 4-е место! Не добавляй никаких пояснений или маркдауна вокруг, верни только сплошной чистый JSON-массив! Убедись что нет ошибок экранирования.`;

            try {
                let ans = await fetchGemini(sysPrompt);
                let txt = ans.replace(/```json/gi, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(txt);
                
                state.editorData.title = `ИИ: ${topic}`;
                state.editorData.items = parsed;
                document.getElementById('editor-items-list').innerHTML = renderEditorItems();
                document.getElementById('app-root').innerHTML = renderEditor(); 
                
                document.getElementById('ai-modal').classList.add('active');
                appendAIMsg(`✨ Ура! Я сгенерировал контент по теме "<b>${topic}</b>". Проверьте его в редакторе!`, 'bot');
            } catch(e) {
                console.error(e);
                alert("Ошибка ИИ: Сбой формата. Попробуйте сформулировать тему проще.");
            } finally {
                btnI.classList.remove('fa-spin');
            }
        }
        
        async function aiExplain(q, correctAns) {
            document.getElementById('ai-modal').classList.add('active');
            appendAIMsg(`Помоги! Произошла ошибка. Объясни, почему правильный ответ (или лишнее слово) на задание "${q}" — это "${correctAns}"?`, 'user');
            
            const msgObj = document.createElement('div');
            msgObj.className = 'msg bot flex gap-2 items-center';
            msgObj.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-[#38bdf8]"></i> Анализирую ошибку...';
            document.getElementById('ai-msgs').appendChild(msgObj);
            document.getElementById('ai-msgs').scrollTop = document.getElementById('ai-msgs').scrollHeight;
            
            const sysPrompt = `Ты учитель. Ученик ошибся в интерактивном тесте. Задание/вопрос/категория: "${q}". Правильный ответ: "${correctAns}". Очень коротко (в 2-3 предложениях) и позитивно объясни, почему этот ответ правильный или почему это слово было лишним. Обращайся на 'вы'. Используй HTML-теги для выделения (<b>) вместо маркдауна.`;
            let ans = await fetchGemini(sysPrompt);
            
            msgObj.innerHTML = ans.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            document.getElementById('ai-msgs').scrollTop = document.getElementById('ai-msgs').scrollHeight;
        }

    </script>

function changeLangGlobal(lang) {
    localStorage.setItem('vsh-lang', lang);
    var gtrans = '/ru/' + lang;
    if (lang === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
        document.cookie = "googtrans=" + gtrans + "; path=/";
        if (location.hostname) document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
    }
    location.reload();
}
