<body class="lab-lobby kaz-theme">
    <div class="app-container">
        <header class="glass-header">
            <div class="header-left">
                <a href="index.html#kazakh" class="btn-back" title="Артқа">⬅</a>
                <h1>Грамматика: <span class="accent" style="color: #00cccc;">Сөйлем Құрау</span></h1>
            </div>
        </header>

        <main class="simulation-container" style="background: transparent;">
            <div class="kaz-pattern"></div>

            <div class="grammar-container">
                <div class="grammar-task" id="grammar-task-text">Сөйлемді дұрыс құраңыз:</div>

                <div class="sentence-area" id="sentence-area">
                    <!-- Dropped words go here -->
                </div>

                <div class="word-pool" id="word-pool">
                    <!-- Word chips go here -->
                </div>

                <div class="msg-grammar" id="grammar-msg"></div>

                <div style="margin-top: 40px;">
                    <button id="btn-check-grammar" class="btn primary">Тексеру (Проверить)</button>
                    <button id="btn-next-grammar" class="btn secondary" style="display:none; margin-left: 10px;">Келесі
                        ➡</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SENTENCES = [
            { text: "Менің атым Арман", trans: "Меня зовут Арман" },
            { text: "Бүгін күн суық", trans: "Сегодня холодно" },
            { text: "Мен мектепке барамын", trans: "Я иду в школу" },
            { text: "Сенің жасың нешеде", trans: "Сколько тебе лет?" },
            { text: "Аспан өте ашық", trans: "Небо очень ясное" },
            { text: "Біз футбол ойнаймыз", trans: "Мы играем в футбол" }
        ];

        let currentSentIdx = 0;
        let currentBuiltSentence = [];

        function initGrammar() {
            document.getElementById('btn-check-grammar').addEventListener('click', checkGrammar);
            document.getElementById('btn-next-grammar').addEventListener('click', () => {
                currentSentIdx = (currentSentIdx + 1) % SENTENCES.length;
                loadGrammarLevel(currentSentIdx);
            });
            loadGrammarLevel(0);
        }

        function loadGrammarLevel(idx) {
            const data = SENTENCES[idx];
            document.getElementById('grammar-task-text').innerHTML = `Сөйлем құра: <br><span style="color:#aaa; font-size:1rem">"${data.trans}"</span>`;

            const pool = document.getElementById('word-pool');
            const area = document.getElementById('sentence-area');
            pool.innerHTML = '';
            area.innerHTML = '';
            document.getElementById('grammar-msg').innerText = '';
            document.getElementById('grammar-msg').className = 'msg-grammar';
            document.getElementById('btn-next-grammar').style.display = 'none';
            document.getElementById('btn-check-grammar').style.display = 'inline-block';

            currentBuiltSentence = [];

            // Create Chips (Shuffled)
            const words = data.text.split(' ');
            const shuffled = [...words].sort(() => Math.random() - 0.5);

            shuffled.forEach(word => {
                const chip = document.createElement('div');
                chip.className = 'word-chip';
                chip.innerText = word;
                chip.addEventListener('click', () => toggleWord(chip, word));
                pool.appendChild(chip);
            });
        }

        function toggleWord(chip, word) {
            const pool = document.getElementById('word-pool');
            const area = document.getElementById('sentence-area');

            if (chip.parentElement === pool) {
                // Move to area
                area.appendChild(chip);
                currentBuiltSentence.push(word);
                chip.classList.add('in-sentence');
            } else {
                // Move back to pool
                pool.appendChild(chip);
                chip.classList.remove('in-sentence');
            }
        }

        function checkGrammar() {
            const data = SENTENCES[currentSentIdx];
            const currentWords = Array.from(document.getElementById('sentence-area').children).map(c => c.innerText);
            const attempt = currentWords.join(' ');

            const msg = document.getElementById('grammar-msg');

            if (attempt === data.text) {
                msg.innerText = "✅ Дұрыс! (Правильно!)";
                msg.className = "msg-grammar correct";
                document.getElementById('btn-check-grammar').style.display = 'none';
                document.getElementById('btn-next-grammar').style.display = 'inline-block';
            } else {
                msg.innerText = "❌ Қате. Қайталап көр. (Неверно)";
                msg.className = "msg-grammar wrong";
            }
        }

        initGrammar();
    </script>

            <button class="floating-lang-btn " onclick="changeLangGlobal('ru')">RU</button>

            <button class="floating-lang-btn " onclick="changeLangGlobal('en')">EN</button>
        `;
        
        // set active
        const btns = switcher.querySelectorAll('.floating-lang-btn');

        else if (currentLang === 'kk') btns[1].classList.add('active');

})();

function changeLangGlobal(lang) {
    localStorage.setItem('vsh-lang', lang);
    var gtrans = '/ru/' + lang;
    if (lang === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
        document.cookie = "googtrans=" + gtrans + "; path=/";
        if (location.hostname) document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
    }
    location.reload();
}
