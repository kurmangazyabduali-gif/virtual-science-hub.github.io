<body>

    <div class="header">
        <h1>🌪️ Word Scramble</h1>
        <p>Unscramble the letters to find the correct word before time runs out!</p>
    </div>

    <div class="game-panel">
        <div class="score-hud">
            <span>Score: <span id="score" style="color:#4ade80;">0</span></span>
            <span>Level: <span id="level">1</span></span>
        </div>

        <div class="timer-bar-bg"><div class="timer-bar-fill" id="timerFill"></div></div>
        
        <div class="hint" id="hintBox">"Hint goes here"</div>
        <div class="scrambled-letters" id="scrambleBox"></div>

        <div class="input-group">
            <input type="text" class="word-input" id="wordInput" placeholder="TYPE HERE..." autocomplete="off">
        </div>
        
        <button class="btn-check" onclick="checkWord()">SUBMIT</button>
    </div>

    <a href="index.html" class="btn-back">← Back to Lobby</a>

    <script>
        const words = [
            { w: 'SCIENCE', h: 'Study of the physical and natural world' },
            { w: 'GRAVITY', h: 'Force that draws objects together' },
            { w: 'COMPUTER', h: 'Electronic machine for processing data' },
            { w: 'PYTHON', h: 'A snake, or a programming language' },
            { w: 'BIOLOGY', h: 'Study of living organisms' },
            { w: 'UNIVERSE', h: 'All existing matter and space' },
            { w: 'CHEMISTRY', h: 'Study of elements and compounds' },
            { w: 'ENERGY', h: 'Capacity to do work' },
            { w: 'GENETICS', h: 'Study of heredity and inherited traits' },
            { w: 'ASTRONOMY', h: 'Study of space and celestial bodies' }
        ];

        let currentWord = {};
        let score = 0;
        let level = 1;
        let timeLeft = 100; // percentage
        let timerInterval;

        function shuffle(str) {
            let arr = str.split('');
            for(let i = arr.length - 1; i > 0; i--){
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            // Ensure it's not the same
            if (arr.join('') === str && str.length > 1) return shuffle(str);
            return arr.join('');
        }

        function startGame() {
            score = 0; level = 1;
            document.getElementById('score').textContent = score;
            nextWord();
        }

        function nextWord() {
            document.getElementById('level').textContent = level;
            currentWord = words[Math.floor(Math.random() * words.length)];
            const scrambled = shuffle(currentWord.w);
            
            document.getElementById('hintBox').textContent = `"${currentWord.h}"`;
            
            const box = document.getElementById('scrambleBox');
            box.innerHTML = '';
            scrambled.split('').forEach(l => {
                const span = document.createElement('div');
                span.className = 'letter';
                span.textContent = l;
                box.appendChild(span);
            });

            const input = document.getElementById('wordInput');
            input.value = '';
            input.classList.remove('error');
            input.focus();

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 100;
            const fill = document.getElementById('timerFill');
            fill.style.width = '100%';
            fill.style.backgroundColor = '#4ade80';

            const speed = Math.max(20, 100 - (level * 5)); // gets faster

            timerInterval = setInterval(() => {
                timeLeft -= 0.5;
                fill.style.width = timeLeft + '%';
                if (timeLeft < 30) fill.style.backgroundColor = '#ef4444';
                else if (timeLeft < 60) fill.style.backgroundColor = '#facc15';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert(`Time's up! The word was ${currentWord.w}. Final Score: ${score}`);
                    startGame();
                }
            }, speed);
        }

        function checkWord() {
            const input = document.getElementById('wordInput');
            const val = input.value.trim().toUpperCase();

            if (val === currentWord.w) {
                // correct
                clearInterval(timerInterval);
                input.style.borderColor = '#4ade80';
                score += (10 * level) + Math.floor(timeLeft);
                level++;
                document.getElementById('score').textContent = score;
                setTimeout(() => {
                    input.style.borderColor = '';
                    nextWord();
                }, 500);
            } else {
                // wrong
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 400);
            }
        }

        document.getElementById('wordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkWord();
        });

        startGame();
    </script>

function changeLangGlobal(lang) {
    localStorage.setItem('vsh-lang', lang);
    var gtrans = '/ru/' + lang;
    if (lang === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
        document.cookie = "googtrans=" + gtrans + "; path=/";
        if (location.hostname) document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
    }
    location.reload();
}
