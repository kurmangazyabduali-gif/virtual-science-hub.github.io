<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатория: Оптика</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Optics Specific Styles */
        .optics-canvas {
            background-color: #000;
            /* Pitch black for best contrast */
            box-shadow: inset 0 0 50px rgba(0, 255, 157, 0.1);
        }
    </style>

    <script id="early-lang-sync">
        (function() {
            let cl = localStorage.getItem('vsh-lang') || 'kk';
            var gt = '/ru/' + cl;
            if (cl === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
                document.cookie = "googtrans=" + gt + "; path=/";
                if (location.hostname) {
                    document.cookie = "googtrans=" + gt + "; domain=" + location.hostname + "; path=/";
                    document.cookie = "googtrans=" + gt + "; domain=." + location.hostname + "; path=/";
                }
            }
        })();
    </script>
</head>

<body class="lab-optics">
    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="header-left">
                <a href="index.html" class="btn-back" title="В главное меню">⬅</a>
                <h1>Ray <span class="accent" style="color: #00ff9d;">Optics</span></h1>
            </div>
            <div class="stats">
                <div class="stat-item">Лучей: <span id="ray-count">0</span></div>
            </div>
        </header>

        <!-- Main Simulation Area -->
        <main class="simulation-container">
            <canvas id="optics-canvas" class="optics-canvas"></canvas>

            <div id="victory-modal" class="victory-modal">
                <h2>Победа! 🎯</h2>
                <p>Луч достиг цели.</p>
                <button id="btn-next-level" class="btn primary" style="margin-top: 1rem;">Следующий Уровень ➡</button>
            </div>

            <!-- Controls -->
            <aside class="controls-panel glass-panel">
                <div class="control-group header-group">
                    <h2>Инструменты</h2>
                    <div class="toggle-group" id="tool-group">
                        <button class="btn toggle-btn active" data-tool="laser" title="Лазер">🔦</button>
                        <button class="btn toggle-btn" data-tool="mirror" title="Зеркало">🪞</button>
                        <button class="btn toggle-btn" data-tool="wall" title="Стена (Поглотитель)">🧱</button>
                    </div>
                </div>

                <div class="control-group">
                    <h2>Цвет Лазера</h2>
                    <input type="color" id="laser-color" value="#ff0000"
                        style="width:100%; height:40px; border:none; background:transparent; cursor:pointer;">
                </div>

                <div class="control-group checkbox-group">
                    <label for="show-normals">Показать нормали</label>
                    <input type="checkbox" id="show-normals">
                </div>

                <hr class="divider">

                <div id="level-indicator" class="level-indicator">Уровень 1</div>
                <button id="btn-challenge" class="btn primary"
                    style="width: 100%; margin-bottom: 10px; background: linear-gradient(45deg, #ff0055, #ff9900);">🎯
                    Режим Испытаний</button>

                <div class="instruction">
                    <p>🔦 <b>Лазер:</b> Кликните и тяните, чтобы задать направление.</p>
                    <p>🪞 <b>Зеркало:</b> Рисуйте линии, от которых отражается свет.</p>
                </div>

                <div class="buttons-grid" style="margin-top: 10px;">
                    <button id="btn-clear" class="btn danger" style="grid-column: span 2;">Очистить Всё</button>
                </div>
            </aside>
        </main>
    </div>
    <script src="optics.js"></script>

<!-- Global Language Switcher & Google Translate -->
<div id="google_translate_element" style="display:none;"></div>
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'ru', includedLanguages: 'ru,en,kk', autoDisplay: false}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
(function() {
    let currentLang = localStorage.getItem('vsh-lang') || 'kk';

    // Synchronize cookie if needed
    var gtrans = '/ru/' + currentLang;
    if (currentLang === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
        document.cookie = "googtrans=" + gtrans + "; path=/";
        if (location.hostname) {
            document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
        }
    }

    // Floating UI
    const isIndex = location.pathname.endsWith('index.html') || location.pathname.endsWith('/') || location.pathname.endsWith('studio.html');
    if (!document.querySelector('.floating-lang-switcher')) {
        const style = document.createElement('style');
        style.innerHTML = `
            body { top: 0 !important; }
            .skiptranslate { display: none !important; }
            .floating-lang-switcher {
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: rgba(15, 23, 42, 0.9);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.1);
                border-radius: 20px;
                padding: 10px;
                display: flex;
                gap: 10px;
                z-index: 999999;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
                font-family: 'Roboto', sans-serif;
            }
            .floating-lang-btn {
                background: transparent;
                border: 1px solid rgba(255,255,255,0.2);
                color: #94a3b8;
                font-size: 14px;
                font-weight: 600;
                padding: 8px 15px;
                border-radius: 12px;
                cursor: pointer;
                transition: 0.3s;
            }
            .floating-lang-btn:hover {
                color: #fff;
                background: rgba(255,255,255,0.1);
            }
            .floating-lang-btn.active {
                background: linear-gradient(135deg, #a855f7, #3b82f6);
                color: #fff;
                border-color: transparent;
            }
        `;
        document.head.appendChild(style);

        const switcher = document.createElement('div');
        switcher.className = 'floating-lang-switcher notranslate';
        switcher.innerHTML = `
            <button class="floating-lang-btn " onclick="changeLangGlobal('ru')">RU</button>
            <button class="floating-lang-btn " onclick="changeLangGlobal('kk')">ҚАЗ</button>
            <button class="floating-lang-btn " onclick="changeLangGlobal('en')">EN</button>
        `;
        
        // set active
        const btns = switcher.querySelectorAll('.floating-lang-btn');
        if (currentLang === 'ru') btns[0].classList.add('active');
        else if (currentLang === 'kk') btns[1].classList.add('active');
        else if (currentLang === 'en') btns[2].classList.add('active');

        document.body.appendChild(switcher);
    }
})();

function changeLangGlobal(lang) {
    localStorage.setItem('vsh-lang', lang);
    var gtrans = '/ru/' + lang;
    if (lang === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
        document.cookie = "googtrans=" + gtrans + "; path=/";
        if (location.hostname) document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
    }
    location.reload();
}
</script>
\n</body>

</html>
