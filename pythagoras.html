<body>
    <div class="lab-container">
        <h1>📐 Теорема Пифагора</h1>
        <p>Изменяйте длины катетов <b>a</b> и <b>b</b>, чтобы увидеть, как пересчитывается гипотенуза <b>c</b> (c² = a² + b²).</p>
        
        <div class="interactive-area">
            <div class="canvas-container">
                <canvas id="triangleCanvas" width="400" height="400"></canvas>
            </div>
            
            <div class="controls-panel">
                <div class="slider-group">
                    <label>Катет a: <span id="valA">3</span></label>
                    <input type="range" id="sliderA" min="1" max="15" value="3" step="1">
                </div>
                <div class="slider-group">
                    <label>Катет b: <span id="valB">4</span></label>
                    <input type="range" id="sliderB" min="1" max="15" value="4" step="1">
                </div>
                
                <div class="equation-box">
                    <h2>a² + b² = c²</h2>
                    <div class="formula" id="formulaDisplay">3² + 4² = c²</div>
                    <div class="formula" id="resultDisplay" style="color: #4ade80; margin-top:10px;">c = 5</div>
                </div>
            </div>
        </div>

        <a href="index.html" class="btn-back">← Вернуться в лобби</a>
    </div>

    <script>
        const canvas = document.getElementById('triangleCanvas');
        const ctx = canvas.getContext('2d');
        const sliderA = document.getElementById('sliderA');
        const sliderB = document.getElementById('sliderB');
        const valA = document.getElementById('valA');
        const valB = document.getElementById('valB');
        const formulaDisplay = document.getElementById('formulaDisplay');
        const resultDisplay = document.getElementById('resultDisplay');

        const scale = 20;
        const originX = 50;
        const originY = 350;

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.lineWidth = 1;

            for(let x=0; x<=canvas.width; x+=scale) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y=0; y<=canvas.height; y+=scale) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function update() {
            let a = parseInt(sliderA.value);
            let b = parseInt(sliderB.value);
            let c = Math.sqrt(a*a + b*b);

            valA.textContent = a;
            valB.textContent = b;
            
            formulaDisplay.textContent = `${a}² + ${b}² = c²`;
            formulaDisplay.innerHTML += `<br><span style="font-size: 20px; color:#cbd5e1;">${a*a} + ${b*b} = ${a*a + b*b}</span>`;
            
            resultDisplay.textContent = `c = ${c % 1 === 0 ? c : c.toFixed(2)}`;

            drawGrid();

            const endX = originX + b * scale;
            const endY = originY - a * scale;

            // Draw right angle symbol
            ctx.strokeStyle = "#8b5cf6";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(originX + 15, originY);
            ctx.lineTo(originX + 15, originY - 15);
            ctx.lineTo(originX, originY - 15);
            ctx.stroke();

            // Draw Triangle
            ctx.fillStyle = "rgba(139, 92, 246, 0.2)";
            ctx.beginPath();
            ctx.moveTo(originX, originY);        // Right angle point
            ctx.lineTo(endX, originY);           // line b
            ctx.lineTo(originX, endY);           // line c (hypotenuse ending point)
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.lineWidth = 4;
            // a
            ctx.strokeStyle = "#ef4444";
            ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX, endY); ctx.stroke();
            // b
            ctx.strokeStyle = "#3b82f6";
            ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(endX, originY); ctx.stroke();
            // c
            ctx.strokeStyle = "#10b981";
            ctx.beginPath(); ctx.moveTo(originX, endY); ctx.lineTo(endX, originY); ctx.stroke();

            // Labels
            ctx.font = "bold 16px Roboto";
            ctx.fillStyle = "#ef4444";
            ctx.fillText(`a=${a}`, originX - 30, originY - (a*scale)/2);
            
            ctx.fillStyle = "#3b82f6";
            ctx.fillText(`b=${b}`, originX + (b*scale)/2 - 15, originY + 25);
            
            ctx.fillStyle = "#10b981";
            ctx.save();
            ctx.translate(originX + (b*scale)/2, originY - (a*scale)/2);
            let angle = Math.atan2(a, b);
            
            ctx.fillText(`c=${c % 1 === 0 ? c : c.toFixed(1)}`, 10, -10);
            ctx.restore();
        }

        sliderA.addEventListener('input', update);
        sliderB.addEventListener('input', update);

        update();
    </script>

 } else {

        const style = document.createElement('style');

            }
            .floating-lang-btn {
                background: transparent;

            }

                color: #fff;
                border-color: transparent;
            }
        `;
        document.head.appendChild(style);

        const switcher = document.createElement('div');
        switcher.className = 'floating-lang-switcher notranslate';
        switcher.innerHTML = `
            <button class="floating-lang-btn " onclick="changeLangGlobal('ru')">RU</button>
            <button class="floating-lang-btn " onclick="changeLangGlobal('kk')">ҚАЗ</button>
            <button class="floating-lang-btn " onclick="changeLangGlobal('en')">EN</button>
        `;
        
        // set active
        const btns = switcher.querySelectorAll('.floating-lang-btn');
        if (currentLang === 'ru') btns[0].classList.add('active');
        else if (currentLang === 'kk') btns[1].classList.add('active');
        else if (currentLang === 'en') btns[2].classList.add('active');

        document.body.appendChild(switcher);
    }
})();

function changeLangGlobal(lang) {
    localStorage.setItem('vsh-lang', lang);
    var gtrans = '/ru/' + lang;
    if (lang === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
        document.cookie = "googtrans=" + gtrans + "; path=/";
        if (location.hostname) document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
    }
    location.reload();
}
</script>
