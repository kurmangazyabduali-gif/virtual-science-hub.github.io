<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатория: Маятники</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .pendulum-canvas {
            /* Subtle grid background */
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
    </style>

    <script id="early-lang-sync">
        (function() {
            let cl = localStorage.getItem('vsh-lang') || 'kk';
            var gt = '/ru/' + cl;
            if (cl === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
                document.cookie = "googtrans=" + gt + "; path=/";
                if (location.hostname) {
                    document.cookie = "googtrans=" + gt + "; domain=" + location.hostname + "; path=/";
                    document.cookie = "googtrans=" + gt + "; domain=." + location.hostname + "; path=/";
                }
            }
        })();
    </script>
</head>

<body class="lab-pendulum">
    <div class="app-container">
        <header class="glass-header">
            <div class="header-left">
                <a href="index.html" class="btn-back" title="В главное меню">⬅</a>
                <h1>Pendulum <span class="accent" style="color: #bc13fe;">Wave</span></h1>
            </div>
        </header>

        <main class="simulation-container">
            <canvas id="pendulum-canvas" class="pendulum-canvas"></canvas>

            <div id="victory-modal" class="victory-modal">
                <h2>Гармония! 🎵</h2>
                <p>Вы нашли идеальный резонанс.</p>
                <button id="btn-restart-game" class="btn primary" style="margin-top: 1rem;">Повторить ↻</button>
            </div>

            <aside class="controls-panel glass-panel">
                <div class="control-group">
                    <h2>Управление</h2>
                    <button id="btn-start" class="btn primary" style="width:100%; margin-bottom:10px;">Запуск</button>
                    <button id="btn-reset" class="btn danger" style="width:100%;">Сброс</button>
                </div>

                <hr class="divider">

                <div class="control-group">
                    <label for="count">Количество маятников: <span id="count-val"
                            class="value-display">15</span></label>
                    <input type="range" id="count" min="5" max="30" value="15">
                </div>

                <div class="control-group">
                    <label for="speed">Скорость времени: <span id="speed-val" class="value-display">1.0x</span></label>
                    <input type="range" id="speed" min="0.1" max="2.0" step="0.1" value="1.0">
                </div>

                <div class="control-group checkbox-group">
                    <label for="view-3d">Изометрия (3D)</label>
                    <input type="checkbox" id="view-3d" checked>
                </div>

                <hr class="divider">

                <button id="btn-challenge" class="btn primary"
                    style="width: 100%; margin-bottom: 10px; background: linear-gradient(45deg, #bc13fe, #00f3ff);">🧩
                    Режим Испытаний 'Гармония'</button>

                <div class="instruction">
                    <p>Наблюдайте, как маятники разной длины создают волновые узоры.</p>
                </div>
            </aside>
        </main>
    </div>
    <script src="pendulum.js"></script>

<!-- Global Language Switcher & Google Translate -->
<div id="google_translate_element" style="display:none;"></div>
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'ru', includedLanguages: 'ru,en,kk', autoDisplay: false}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
(function() {
    let currentLang = localStorage.getItem('vsh-lang') || 'kk';

    // Synchronize cookie if needed
    var gtrans = '/ru/' + currentLang;
    if (currentLang === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
        document.cookie = "googtrans=" + gtrans + "; path=/";
        if (location.hostname) {
            document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
        }
    }

    // Floating UI
    const isIndex = location.pathname.endsWith('index.html') || location.pathname.endsWith('/') || location.pathname.endsWith('studio.html');
    if (!document.querySelector('.floating-lang-switcher')) {
        const style = document.createElement('style');
        style.innerHTML = `
            body { top: 0 !important; }
            .skiptranslate { display: none !important; }
            .floating-lang-switcher {
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: rgba(15, 23, 42, 0.9);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.1);
                border-radius: 20px;
                padding: 10px;
                display: flex;
                gap: 10px;
                z-index: 999999;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
                font-family: 'Roboto', sans-serif;
            }
            .floating-lang-btn {
                background: transparent;
                border: 1px solid rgba(255,255,255,0.2);
                color: #94a3b8;
                font-size: 14px;
                font-weight: 600;
                padding: 8px 15px;
                border-radius: 12px;
                cursor: pointer;
                transition: 0.3s;
            }
            .floating-lang-btn:hover {
                color: #fff;
                background: rgba(255,255,255,0.1);
            }
            .floating-lang-btn.active {
                background: linear-gradient(135deg, #a855f7, #3b82f6);
                color: #fff;
                border-color: transparent;
            }
        `;
        document.head.appendChild(style);

        const switcher = document.createElement('div');
        switcher.className = 'floating-lang-switcher notranslate';
        switcher.innerHTML = `
            <button class="floating-lang-btn " onclick="changeLangGlobal('ru')">RU</button>
            <button class="floating-lang-btn " onclick="changeLangGlobal('kk')">ҚАЗ</button>
            <button class="floating-lang-btn " onclick="changeLangGlobal('en')">EN</button>
        `;
        
        // set active
        const btns = switcher.querySelectorAll('.floating-lang-btn');
        if (currentLang === 'ru') btns[0].classList.add('active');
        else if (currentLang === 'kk') btns[1].classList.add('active');
        else if (currentLang === 'en') btns[2].classList.add('active');

        document.body.appendChild(switcher);
    }
})();

function changeLangGlobal(lang) {
    localStorage.setItem('vsh-lang', lang);
    var gtrans = '/ru/' + lang;
    if (lang === 'ru') { 
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        if (location.hostname) {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + location.hostname + "; path=/;";
        }
 } else {
        document.cookie = "googtrans=" + gtrans + "; path=/";
        if (location.hostname) document.cookie = "googtrans=" + gtrans + "; domain=" + location.hostname + "; path=/";
    }
    location.reload();
}
</script>
\n</body>

</html>
